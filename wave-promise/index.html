var touchSide=0,touchX=0.5,touchY=0.5,touchDown=false,tapPulse=0;
var touchStartT=0,tapX=0.5,tapY=0.5;
function gameActive(){ return running&&!paused&&$('dlg').style.display!=='block'; }
function sideFrom(x){ return x<W/2?-1:1; }
function onStart(e){
  /* UI 按钮不拦截：让 click 正常触发 */
  if(e.target&&e.target.closest&&e.target.closest('button'))return;
  if(!cur)return;
  /* 游戏内小对话（dlg）：点按关闭——不依赖 running 状态（retry 后 running=false 也要能关） */
  var d=$('dlg');
  if(d.style.display==='block'){
    d.style.display='none';
    if(state._pendingStart){ var ps=state._pendingStart; state._pendingStart=null;
      startCountdown(function(){ running=true;paused=false;lastT=performance.now();ps(); }); }
    if(state.onAdvance){var f=state.onAdvance;state.onAdvance=null;}
    if(e.cancelable)e.preventDefault(); return;
  }
  if(!running||paused)return;
  var t=e.touches?e.touches[0]:e;
  touchSide=sideFrom(t.clientX);
  if(t){ touchX=t.clientX/W;touchY=t.clientY/H;touchDown=true;touchStartT=performance.now(); }
  if(e.cancelable)e.preventDefault();
}
function onMove(e){ if(!gameActive())return;
  var t=e.touches?e.touches[0]:e; if(t){touchSide=sideFrom(t.clientX);touchX=t.clientX/W;}
  if(e.cancelable)e.preventDefault(); }
function onEnd(){
  touchSide=0;touchDown=false;

    tapPulse=1;tapX=touchX;tapY=touchY;
  }
  touchStartT=0;
}

  if(e.key==='ArrowLeft'||e.key==='a'){touchSide=-1;touchX=Math.max(0.08,touchX-0.06);}
  if(e.key==='ArrowRight'||e.key==='d'){touchSide=1;touchX=Math.min(0.92,touchX+0.06);}

  for(var wi=0;wi<FX.streaks.length;wi++){ var wl=FX.streaks[wi],wa=1-wl.t/wl.life;

    if(wl.side==='top'){X.moveTo(wl.x-11,wl.y);X.lineTo(wl.x+11,wl.y);}

      X.translate(p.x,p.y);X.rotate((p.rot||0)+p.t*(p.vr||4));
      X.fillStyle=p.color;X.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.7);
      X.restore();continue;
    }
    if(p.star){
      X.save();X.globalAlpha=Math.max(0,1-p.t/p.life);
      X.translate(p.x,p.y);X.rotate(p.t*6);

      for(var si=0;si<4;si++){
        var an=si*Math.PI/2;

      }
      X.lineWidth=2;X.strokeStyle=p.color;X.stroke();

    }
    if(p.bubble){
      X.globalAlpha=Math.max(0,1-p.t/p.life)*0.85;
      X.strokeStyle=p.color;X.lineWidth=1.4;
      X.beginPath();X.arc(p.x,p.y,p.size,0,7);X.stroke();

    }

      X.globalAlpha=Math.max(0,1-p.t/p.life)*0.9;
      X.strokeStyle=p.color;X.lineWidth=2;
      X.beginPath();

    }

    X.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); }
  X.globalAlpha=1;
  for(var j=0;j<FX.floats.length;j++){ var f=FX.floats[j];
    if(f.y<-30||f.y>H+30)continue;
    var a=f.t<f.life*0.7?1:1-(f.t-f.life*0.7)/(f.life*0.3);

    X.beginPath(); X.arc(FX.flashX,FX.flashY,18,0,7); X.fill(); X.globalAlpha=1; }
  X.restore();
}

/* ================= 玩法B（Day2）：深潜之约 · Push Your Luck ================= */
function diverY(s){ return (s.depth/280)*(H-120)+60; }
function makeCreatures2(){
      var result=[];
      var rows=[
        [{e:'🐟',v:1,jelly:false,eel:false}],
        [{e:'🐡',v:3,jelly:false,eel:false},{e:'🪼',v:0,jelly:true,eel:false}],
        [{e:'🪼',v:0,jelly:true,eel:false},{e:'🐠',v:6,jelly:false,eel:false}],
        [{e:'🪼',v:0,jelly:true,eel:false},{e:'🐙',v:7,jelly:false,eel:false},{e:'🐍',v:0,jelly:false,eel:true}],
        [{e:'🐙',v:7,jelly:false,eel:false},{e:'🐍',v:0,jelly:false,eel:true}],
        [{e:'🌙',v:14,jelly:false,eel:false},{e:'🌙',v:12,jelly:false,eel:false},{e:'💎',v:40,jelly:false,eel:false,pearl:true}]
      ];

      for(var d=30;d<=270;d+=22){
        var zone=Math.min(5,Math.floor(d/45));
        var row=rows[zone];
        var item=row[Math.floor(Math.random()*row.length)];

        result.push({
          e:item.e,
          v:item.v,
          x:0.12+Math.random()*0.76,
          d:d,
          jelly:!!item.jelly,
          eel:!!item.eel,
          pearl:!!item.pearl,
          vx:item.eel?(Math.random()<0.5?-25:25):0,
          dead:false
        });
      }

      var hasFish=false;
      var hasEel=false;
      var hasPearl=false;

      for(var i=0;i<result.length;i++){
        if(result[i].v===6)hasFish=true;
        if(result[i].eel)hasEel=true;
        if(result[i].pearl)hasPearl=true;
      }

      if(!hasFish){
        result.push({
          e:'🐠',v:6,x:0.5,d:120,
          jelly:false,eel:false,pearl:false,vx:0,dead:false
        });
      }

      if(!hasEel){
        result.push({
          e:'🐍',v:0,x:0.7,d:180,
          jelly:false,eel:true,pearl:false,vx:25,dead:false
        });
      }

      if(!hasPearl){
        result.push({
          e:'💎',v:40,x:0.35,d:265,
          jelly:false,eel:false,pearl:true,vx:0,dead:false
        });
      }

      return result;
    
}

GAME[2]=function(){return{

  },

  update:function(dt,t,s){

    }

    if(s.mode==='wait'){

        s.mode='dive';
      }
    }else if(s.mode==='dive'){
      var speed=s.depth<150?55:32;

        (cfg.d2O2)/

      s.depth+=speed*dt;

      }
    }

    /*

     */
    var dog=dogPosition(s);

    /*
     * 只更新一次鳗鱼位置。
     * 所有生物的可见位置和判定位置都使用 c.x、c.d，
     * 不再给绘制额外添加 sin 横向偏移。
     */
    for(var i=s.creatures.length-1;i>=0;i--){
      var c=s.creatures[i];

      if(c.dead){
        s.creatures.splice(i,1);
        continue;
      }

      if(c.eel){
        var dx=s.px-c.x;

        c.x+=c.vx*(cfg.d2eelSpd||1)*dt/60;
    /* 挑战档机制：鱼群"深水伪装"——半透明但【仍可捕捉】（简单/标准档永不伪装） */
    if(difficulty==='hard'&&(!s.camoT||t-s.camoT>5)){

    }

        /*

         */
        if(Math.abs(c.d-s.depth)<80){
          c.x+=Math.sign(dx)*0.06*dt;
        }

      if((c.jelly||c.eel)&&

    if(tapPulse){

      console.log('NET CAST: netCd='+s.netCd+' creatures='+s.creatures.length+' mode='+s.mode);

      if(s.netCd<=0){
  var netRadius=s.cardNet?0.14*W:0.11*W;
  var caught=[];
  var netX=tapX*W, netY=dog.y;   /* 网心：触点x + 狗当前深度 */
        for(var n=0;n<s.creatures.length;n++){

    for(var ci2=0;ci2<26;ci2++){
      FX.particles.push({x:Math.random()*W,y:-20-Math.random()*80,
        vx:(Math.random()-0.5)*60,vy:90+Math.random()*130,
        life:2.4,t:0,color:['#ffd166','#7ee08a','#7ec8e3','#ff9a5c'][ci2%4],size:4+Math.random()*3});
    }
    /* 通关掉落助攻卡：全屏 juicy 展示 */
    var dropK=grantCard();
    if(dropK)setTimeout(function(){ showCardGet(dropK); },650);
    try{ localStorage.setItem('wave_clear','1'); }catch(e){}
    var gameKey='day'+day;
    var thisScore=(day===3?(state.wave-1)*100+(state.gateIdx||0)*10:(state.score||0));
    var rank=recordScore(gameKey,thisScore);
    $('failText').innerHTML='✅ 过关！<br><br>'+DAYS[day].title+' 完成<br><span style="font-size:13px;opacity:.8;">本关得分 '+thisScore+' · '+playerName()+
      (rank>0&&rank<=8?' · 🏆 本地第 '+rank:'')+'</span>';
    $('btnRetry').textContent='再玩一次';
    show('ovFail'); return; }
  memories.push(DAYS[day].memory);
  var after=day===3?function(){startEnding();}:function(){day++;startDay();};
  if(DAYS[day].win){ showChat(DAYS[day].win,{goLabel:'继续 ▸',onDone:after}); }
  else { fxHeavy(W/2,H*0.4,DAYS[day].title+' 过关！','#ffd166');
    setTimeout(function(){ after(); },900); }
}

/* ============ 助攻卡牌系统 ============ */
var CARDS={
  magnet:{i:'🧲',n:'渔网加宽',d:'本关撒网范围+60%',use:function(s){ s.cardNet=1; }},
  calm:{i:'🫧',n:'静心呼吸',d:'本关氧气消耗-35%',use:function(s){ s.cardO2=1; }},
  push:{i:'💪',n:'大力出奇迹',d:'本关弹珠伤害×1.6',use:function(s){ s.cardDmg=1.6; }},
  preview:{i:'👁️',n:'预知之眼',d:'本关标记即将投放',use:function(s){ s.cardPrev=1; }},
  guard:{i:'🛡️',n:'浪花护盾',d:'本关免一次失败',use:function(s){ s.cardShield=1; }},
  wide:{i:'🎯',n:'广角瞄准',d:'本关弹珠+3',use:function(s){ s.cardBalls=3; }}
};
function ownedCards(){ try{ return JSON.parse(localStorage.getItem('wave_cards')||'[]'); }catch(e){ return []; } }
function saveCards(a){ try{ localStorage.setItem('wave_cards',JSON.stringify(a.slice(0,3))); }catch(e){} }
function grantCard(){
  var a=ownedCards(); if(a.length>=3)return null;
  var keys=Object.keys(CARDS), k=keys[Math.floor(Math.random()*keys.length)];
  a.push(k);saveCards(a);return k;
}
function useCard(k){
  var a=ownedCards(), i=a.indexOf(k);
  if(i<0)return;
  a.splice(i,1);saveCards(a);
  if(CARDS[k]&&CARDS[k].use&&state)CARDS[k].use(state);
  fxFloat(W/2,H*0.4,CARDS[k].i+' '+CARDS[k].n+'！','#ffd166');
}
/* 全屏获得卡牌展示（juicy） */

  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;'+
    'background:radial-gradient(ellipse at 50% 45%,rgba(255,240,180,.55) 0%,rgba(223,244,245,.88) 60%,rgba(168,221,232,.95) 100%);'+
    'transition:opacity .3s;';
  ov.innerHTML=
    '<div style="font-size:15px;font-weight:800;color:#B26A2E;letter-spacing:3px;margin-bottom:18px;'+
      'text-shadow:0 1px 0 #fff;animation:cgTitle .5s cubic-bezier(.16,1,.3,1);">🎴 获得助攻卡！</div>'+
    '<div class="cardGet" style="width:150px;height:200px;border-radius:18px;position:relative;'+
      'background:linear-gradient(165deg,#FFFDF5,#FFE9A8 55%,#F6D77A);'+
      'border:3px solid #fff;box-shadow:0 0 0 3px rgba(246,215,122,.6),0 0 42px rgba(246,215,122,.85),0 16px 40px rgba(99,158,189,.4);'+
      'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;'+
      'animation:cgFlip .62s cubic-bezier(.2,1.4,.4,1);">'+
      '<div style="position:absolute;inset:6px;border-radius:13px;border:1.5px dashed rgba(178,106,46,.4);"></div>'+
      '<div style="font-size:56px;filter:drop-shadow(0 4px 8px rgba(178,106,46,.35));animation:cgBounce .8s .5s cubic-bezier(.2,1.6,.4,1);">'+c.i+'</div>'+
      '<div style="font-size:17px;font-weight:900;color:#5A3A1A;">'+c.n+'</div>'+
      '<div style="font-size:11.5px;color:#8A6A3A;padding:0 14px;line-height:1.5;text-align:center;">'+c.d+'</div>'+
    '</div>'+
    '<div id="cgTap" style="margin-top:26px;font-size:13px;font-weight:700;color:#2E7D8A;'+
      'opacity:0;animation:cgFadeIn .4s .9s forwards;">点击任意处继续</div>';
  var st=document.createElement('style');
  st.textContent=
    '@keyframes cgFlip{0%{transform:perspective(700px) rotateY(95deg) scale(.6);opacity:0}'+
    '60%{transform:perspective(700px) rotateY(-12deg) scale(1.06);opacity:1}'+
    '100%{transform:perspective(700px) rotateY(0) scale(1)}}'+
    '@keyframes cgTitle{0%{transform:translateY(-24px);opacity:0}100%{transform:translateY(0);opacity:1}}'+
    '@keyframes cgBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}'+
    '@keyframes cgFadeIn{to{opacity:1}}';
  ov.appendChild(st);
  document.body.appendChild(ov);
  for(var i=0;i<16;i++){
    var s2=document.createElement('div');
    s2.textContent=['✨','⭐','🌟'][i%3];
    s2.style.cssText='position:absolute;left:'+(5+Math.random()*90)+'%;top:-30px;font-size:'+(14+Math.random()*16)+'px;'+
      'animation:cgStar '+(1.1+Math.random()*0.9)+'s linear '+(Math.random()*0.5)+'s forwards;';
    ov.appendChild(s2);
  }
  var st2=document.createElement('style');
  st2.textContent='@keyframes cgStar{to{transform:translateY('+window.innerHeight+'px) rotate('+(180+Math.random()*360)+'deg);opacity:.2}}';
  ov.appendChild(st2);
  ov.addEventListener('click',function(){
    ov.style.opacity='0';
    setTimeout(function(){ ov.remove();_cardGetting=false; },320);
  });

function showCards(){
  var a=ownedCards(), box=$('cardList');
  if(!a.length){ box.innerHTML='<div style="opacity:.75;font-size:13px;line-height:1.7;">还没有助攻卡<br>通关任意一关就会掉落一张 🎴</div>'; }
  else {
    box.innerHTML=a.map(function(k){
      var c=CARDS[k];
      return '<div class="card" data-k="'+k+'"><div class="ci">'+c.i+'</div>'+
             '<div class="cn">'+c.n+'</div><div class="cd">'+c.d+'</div></div>';
    }).join('');
    box.querySelectorAll('.card').forEach(function(el){
      el.addEventListener('click',function(){ useCard(el.getAttribute('data-k')); showCards(); });
    });
  }
  running=false;
  show('ovCards');
}

      d1pushy:0.8, d2eelSpd:0.7, d3ballGain:1},

      d2o2bot:7,  d2jelly:8,  d2rise:68, d2trips:4,
      d3brick:function(w){return 5+Math.min(6,w);}, d3hp:function(w){return w+Math.floor(w/2);},

    hard:{d1Line:0.32,d2O2:0.7,d2Goal:170,d3Row:8,name:'挑战',

document.addEventListener('click',function(ev){

  var r=btn.getBoundingClientRect();
  var d=Math.max(r.width,r.height);

  rip.style.width=rip.style.height=d+'px';

  rip.style.top=(ev.clientY-r.top-d/2)+'px';

},true);

/* ================= 主循环 ================= */
function startLoop(){
  /* 清一次画布：上一关的画面不会残留到新关卡 */
  X.clearRect(0,0,W,H);
  X.fillStyle='#dff7ff';X.fillRect(0,0,W,H);
  lastT=performance.now();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}
function loop(now){
  if(!running)return;
  var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  var t=now;
  var live=fxUpdate(dt);
  if(cur){
    var frozen=paused||$('dlg').style.display==='block'||countdownActive;
    if(frozen){ cur.draw(t,state); }
    else { if(live)cur.update(dt,t,state); if(running)cur.draw(t,state); }
  }
  fxDraw();
  refreshCardBtn();
  if(running)raf=requestAnimationFrame(loop);
}

/* 调试钩子 */
window._dbg={ get:function(){return {day:day,hearts:hearts,starCount:starCount,starGoal:starGoal,running:running,paused:paused};},

    dist:state.dist,stars:state.stars,obs:state.obs,star:starCount}; },
  win:function(){ if(running)finishWin(); },
  next:function(step){ day=step||day+1;startDay(); } };
