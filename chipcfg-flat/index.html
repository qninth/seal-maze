<!DOCTYPE html>

<head>

<title>chipcfg · 打平地址表归一化 → 系统地址 map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ffffff;--bg2:#f6f5f4;--fg:#1a1a18;--fg2:#6b6a67;--line:#e8e6e3;--acc:#2f6f4f;--hi:#fdf6e3}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);line-height:1.75;font-size:16px}
.wrap{display:flex;min-height:100vh}
nav{width:264px;flex:0 0 264px;background:var(--bg2);border-right:1px solid var(--line);
  padding:32px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
nav .logo{padding:0 24px 20px;font-weight:700;font-size:15px;letter-spacing:.3px}
nav .logo small{display:block;font-weight:400;color:var(--fg2);font-size:12px;margin-top:4px}
nav a{display:block;padding:7px 24px;color:var(--fg2);text-decoration:none;font-size:14px;
  border-left:3px solid transparent}
nav a:hover{background:rgba(0,0,0,.04);color:var(--fg)}
nav a.on{color:var(--acc);border-left-color:var(--acc);background:#fff;font-weight:600}
nav .sub{padding:0 24px 0 40px;font-size:12px;color:var(--fg2)}
nav .sub a{padding:3px 0;font-size:12px;border:none}
main{flex:1;max-width:900px;padding:56px 64px 120px;min-width:0}
h1{font-size:30px;line-height:1.3;margin-bottom:20px;letter-spacing:-.4px}
h2{font-size:21px;margin:44px 0 14px;padding-top:8px}
h3{font-size:17px;margin:28px 0 10px}
p{margin:12px 0}
.lead{color:#3d3c3a;font-size:16.5px}
code{background:var(--bg2);padding:2px 6px;border-radius:4px;font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
pre{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;
  overflow-x:auto;font-size:13.5px;line-height:1.65;margin:14px 0;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}
pre.cmd{background:#fbfaf9}
blockquote{border-left:3px solid var(--acc);background:var(--hi);padding:14px 20px;
  margin:18px 0;border-radius:0 8px 8px 0}
.flow{margin:22px 0}
.step{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:none}
.sn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}
.stat{flex:1;min-width:92px;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px}
.stat-n{font-size:26px;font-weight:700;color:var(--acc);line-height:1.2}
.stat-l{font-size:12.5px;color:var(--fg2);margin-top:2px}
.tbl{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
.tbl th{text-align:left;padding:9px 11px;border-bottom:2px solid var(--line);
  font-size:12.5px;color:var(--fg2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:#fcfcfb}
.tbl.compact td,.tbl.compact th{padding:6px 11px;font-size:13px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.mut{color:var(--fg2)}
.sm{font-size:12.5px}
.hi{color:var(--acc);font-weight:600}
.badge{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:2px 11px;font-size:12px;color:var(--fg2);margin-right:6px}
.badge.file{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.meta{margin:6px 0 14px}
.bus{display:inline-block;padding:1px 9px;border-radius:4px;font-size:12px;font-weight:600}
.b-noc{background:#e8f0ea;color:#2f6f4f}
.b-cfgbus{background:#eaeaf4;color:#4a4a8a}
.src{margin:14px 0}
.src summary{cursor:pointer;color:var(--fg2);font-size:13.5px;padding:6px 0;
  user-select:none;list-style:none}
.src summary::-webkit-details-marker{display:none}
.src summary:before{content:"▸ ";transition:.15s}
.src[open] summary:before{content:"▾ "}
.src summary:hover{color:var(--fg)}
.note{background:#fbfaf8;border-left:3px solid #c9a227;padding:12px 18px;
  border-radius:0 8px 8px 0;font-size:14.5px;margin:16px 0}
.two{margin:14px 0}
.two-h{font-size:13px;color:var(--fg2);font-family:ui-monospace,Consolas,monospace;margin-bottom:6px}
.rules{display:flex;flex-direction:column;gap:12px;margin:18px 0}
.rule{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:14.5px}
.rule b{display:block;margin-bottom:5px}
footer{border-top:1px solid var(--line);margin-top:60px;padding-top:20px;
  font-size:13px;color:var(--fg2)}
#toTop{position:fixed;right:26px;bottom:26px;width:40px;height:40px;border-radius:50%;
  background:#fff;border:1px solid var(--line);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08);
  display:none;align-items:center;justify-content:center;font-size:17px;color:var(--fg2)}
#toTop:hover{background:var(--bg2)}
@media(max-width:820px){
  nav{display:none}
  main{padding:28px 22px 80px}
  h1{font-size:24px}
  .tbl{font-size:12.5px}
  .tbl th,.tbl td{padding:7px 7px}
}
</style>
</head>

<script>
const SECS = ["overview","tables","convert","iso","assemble","query"];
const pages = {"overview": "\n<h1>打平地址表 → 系统地址 map</h1>\n<p class=\"lead\">\n集成者交付的译码表是<b>打平</b>的——每一行的 offset 已经是最终绝对地址，die 偏移、桥接偏移都已经加好了。\n这对人工阅读很友好，但直接喂给 <code>chipcfg compose</code> 会出错：compose 的语义是<b>逐级累加</b>（最终地址 = L1 窗口 offset + L2 窗口 offset + …），\n拿打平表当输入会二次加偏移。\n\n本页用一套虚拟的双 die 芯片，完整展示 <b>5 个步骤</b>：\n</p>\n<div class=\"flow\">\n  <div class=\"step\"><span class=\"sn\">1</span><div><b>看交付件</b>：一级 / 二级 / 三级 / cfgbus 四张打平表长什么样</div></div>\n  <div class=\"step\"><span class=\"sn\">2</span><div><b>减法归一</b>：每行减去<b>直接父窗口</b>基址，得到相对偏移表</div></div>\n  <div class=\"step\"><span class=\"sn\">3</span><div><b>同构检查</b>：两个 die 的相对布局逐条比对，一致才算“die1 和 die0 一样”</div></div>\n  <div class=\"step\"><span class=\"sn\">4</span><div><b>写场景</b>：一份二级表 + 两个带 prefix 的例化（方案 A）</div></div>\n  <div class=\"step\"><span class=\"sn\">5</span><div><b>组装 + 对账</b>：compose 出 52 条路由，逐条和打平件对地址</div></div>\n</div>\n<div class=\"stats\"><div class=\"stat\"><div class=\"stat-n\">4</div><div class=\"stat-l\">打平交付表</div></div><div class=\"stat\"><div class=\"stat-n\">4</div><div class=\"stat-l\">归一化表</div></div><div class=\"stat\"><div class=\"stat-n\">52</div><div class=\"stat-l\">最终路由</div></div><div class=\"stat\"><div class=\"stat-n\">10</div><div class=\"stat-l\">模块叶子</div></div><div class=\"stat\"><div class=\"stat-n\">42</div><div class=\"stat-l\">寄存器</div></div></div>\n\n<h2>一句话结论</h2>\n<blockquote>\n<b>减回去。</b>L1 表不动（它是绝对地址的权威），L2 及以下每张表的 offset 都减去<b>直接父窗口</b>的基址。\n打平原表别扔——它是 compose 之后对账的 golden 基准。\n</blockquote>\n\n<h2>整套命令（4 条）</h2>\n<pre class=\"cmd\"># ① 打平交付件 → 归一化表 + 场景 + compose + 对账，一条命令\nchipcfg flatten l1_sys_flat.yaml \\\n  -t peri_top_flat.yaml -t stars_top_flat.yaml -t cfgbus_uart_flat.yaml \\\n  -r HA=nmanager_ha.csv -r AICORE=nmanager_aicore.csv \\\n  -o out/\n\n# ② 产出（out/）\n#   norm/l1_sys.yaml  norm/peri_top.yaml  norm/stars_top.yaml  norm/cfgbus_uart.yaml\n#   scenario_asbuilt.yaml        ← 场景（方案 A 例化声明）\n#   composed_asbuilt.yaml        ← 最终整系统地址 map，52 条路由\n\n# ③ 下游消费（gen-c / gen-yaml / merge 都吃 composed.yaml）\nchipcfg gen-c out/composed_asbuilt.yaml Hi100_Register_Description.xlsx -o gen/\n\n# ④ 改表后重新对账（flatten 已内置，也可单独跑 compose 对比）\nchipcfg compose out/scenario_asbuilt.yaml -t out/norm/*.yaml -o new.yaml</pre>\n", "tables": "<h1>四个层级，四种打平表</h1><p class=\"lead\">交付件都是 YAML 译码表。区别只在“谁维护、地址范围多大、下级是什么”。</p>\n<section id=\"l1\">\n  <h2>一级译码表</h2>\n  <p class=\"meta\"><span class=\"badge\">bus: noc</span>\n     <span class=\"badge\">维护: 系统方案组</span>\n     <span class=\"badge file\">l1_sys_flat.yaml</span></p>\n  <p>芯片顶层视野：谁能看到 die0、谁能看到 die1。本表是<b>唯一不参与减法</b>的表——它没有父窗口，每行 offset 本身就是最终地址。flatten 只做两件事：把 target 改成归一化表名 / 场景例化实例名。</p>\n  <table class=\"tbl\">\n    <thead><tr><th>窗口名</th><th>打平 offset</th><th>size</th><th>target</th><th>说明</th></tr></thead>\n    <tbody><tr><td><code>die0_peri</code></td><td class=\"mono\">0x0040_0000</td><td class=\"mono\">0x0010_0000</td><td><code>peri_top</code></td><td class=\"mut sm\">— 无父窗口，原样保留</td></tr><tr><td><code>die0_stars</code></td><td class=\"mono\">0x0080_0000</td><td class=\"mono\">0x0010_0000</td><td><code>stars_top</code></td><td class=\"mut sm\">— 无父窗口，原样保留</td></tr><tr><td><code>die1_peri</code></td><td class=\"mono\">0x4040_0000</td><td class=\"mono\">0x0010_0000</td><td><code>peri_top</code></td><td class=\"mut sm\">— die1 空间起点 = 0x4000_0000</td></tr><tr><td><code>die1_stars</code></td><td class=\"mono\">0x4080_0000</td><td class=\"mono\">0x0010_0000</td><td><code>stars_top</code></td><td class=\"mut sm\">— 与 die0 差 0x4000_0000</td></tr></tbody>\n  </table>\n  <details class=\"src\"><summary>打平件原文 l1_sys_flat.yaml</summary>\n    <pre># ═══════════════════════════════════════════════════════════════\n# 【同事交付件】一级译码 — 已打平\n# 所有 offset 为含 die 偏移的绝对地址:\n#   die0 空间 0x0000_0000 ~ 0x3FFF_FFFF (基址 0x0)\n#   die1 空间 0x4000_0000 ~ 0x7FFF_FFFF (基址 0x4000_0000)\n# ═══════════════════════════════════════════════════════════════\ntable: l1_sys_flat\nbus: noc\nlevel: 1\nowner: system-arch\n\nwindows:\n  # ── die0 ──\n  - {name: die0_peri,  offset: 0x0040_0000, size: 0x0010_0000, target: peri_top_flat}\n  - {name: die0_stars, offset: 0x0080_0000, size: 0x0010_0000, target: stars_top_flat}\n  # ── die1 ──\n  - {name: die1_peri,  offset: 0x4040_0000, size: 0x0010_0000, target: peri_top_flat}\n  - {name: die1_stars, offset: 0x4080_0000, size: 0x0010_0000, target: stars_top_flat}\n</pre></details>\n  <p class=\"note\">💡 本表 target 被写成<b>场景例化实例名</b>（<code>die0_peri</code>）而不是表名（<code>peri_top</code>）——这是让 prefix 能传导到整棵子树的关键。写表名会走“单例化快捷方式”，场景 prefix 拿不到，两个 die 的叶子就会同名撞车。</p>\n</section>\n<section id=\"l2peri\">\n  <h2>二级译码表 · peri</h2>\n  <p class=\"meta\"><span class=\"badge\">bus: noc</span>\n     <span class=\"badge\">维护: 顶层集成组</span>\n     <span class=\"badge file\">peri_top_flat.yaml</span></p>\n  <p>peri 子系统：cfgbus 桥接窗口 + gpio 模块。两个 die 的窗口在打平表里混在一起，靠<b>相对布局一致</b>判定同构，归一化后只剩 die0 的一份布局。</p>\n  <table class=\"tbl\">\n    <thead><tr><th>窗口名</th><th>打平 offset</th><th>size</th><th>target</th><th>说明</th></tr></thead>\n    <tbody><tr><td><code>die0_uart_apb</code></td><td class=\"mono\">0x0040_0000</td><td class=\"mono\">0x0040_0000</td><td><code>cfgbus_uart</code></td><td class=\"mut sm\">父基址 = L1 的 die0_peri 窗口</td></tr><tr><td><code>die0_gpio</code></td><td class=\"mono\">0x0041_0000</td><td class=\"mono\">0x0040_0000</td><td><code>GPIO</code></td><td class=\"mut sm\">0x41_0000 − 0x40_0000</td></tr><tr><td><code>die1_uart_apb</code></td><td class=\"mono\">0x4040_0000</td><td class=\"mono\">0x4040_0000</td><td><code>cfgbus_uart</code></td><td class=\"mut sm\">0x4040_0000 − 0x4040_0000 ✓ 同构</td></tr><tr><td><code>die1_gpio</code></td><td class=\"mono\">0x4041_0000</td><td class=\"mono\">0x4040_0000</td><td><code>GPIO</code></td><td class=\"mut sm\">✓ 与 die0 一致</td></tr></tbody>\n  </table>\n  <details class=\"src\"><summary>打平件原文 peri_top_flat.yaml</summary>\n    <pre># ═══════════════════════════════════════════════════════════════\n# 【同事交付件】二级译码 peri 顶层 — 已打平\n# die0/die1 的窗口混在一张表里, 每行地址都是绝对地址。\n# uart_apb 窗口引向 cfgbus 表(三级), gpio 是模块叶子。\n# ═══════════════════════════════════════════════════════════════\ntable: peri_top_flat\nbus: noc\nlevel: 2\nowner: top-integration\n\nwindows:\n  # ── die0 ──\n  - {name: die0_uart_apb, offset: 0x0040_0000, size: 0x0001_0000, target: cfgbus_uart_flat, bridge: true}\n  - {name: die0_gpio,     offset: 0x0041_0000, size: 0x0000_1000, target: GPIO, inst: gpio_die0}\n  # ── die1 ──\n  - {name: die1_uart_apb, offset: 0x4040_0000, size: 0x0001_0000, target: cfgbus_uart_flat, bridge: true}\n  - {name: die1_gpio,     offset: 0x4041_0000, size: 0x0000_1000, target: GPIO, inst: gpio_die1}\n</pre></details>\n  <p class=\"note\">💡 减法的关键是<b>减到直接父窗口</b>：这里要减的不是 die 基址（0x4000_0000），而是 L1 表里 <code>die0_peri</code> 窗口的 0x0040_0000（对 die1 就是 0x4040_0000）。只减 die 基址是错的。</p>\n</section>\n<section id=\"l2stars\">\n  <h2>二级译码表 · stars</h2>\n  <p class=\"meta\"><span class=\"badge\">bus: noc</span>\n     <span class=\"badge\">维护: stars 组</span>\n     <span class=\"badge file\">stars_top_flat.yaml</span></p>\n  <p>stars 子系统：aicore / ha 两个模块。模块寄存器细节不在译码表里，靠 <code>-r AICORE=xxx.csv</code> 注册寄存器表，compose 时自动展开成寄存器级路由。</p>\n  <table class=\"tbl\">\n    <thead><tr><th>窗口名</th><th>打平 offset</th><th>size</th><th>target</th><th>说明</th></tr></thead>\n    <tbody><tr><td><code>die0_aicore</code></td><td class=\"mono\">0x0080_0000</td><td class=\"mono\">0x0080_0000</td><td><code>AICORE</code></td><td class=\"mut sm\">父基址 = L1 的 die0_stars 窗口</td></tr><tr><td><code>die0_ha</code></td><td class=\"mono\">0x0080_1000</td><td class=\"mono\">0x0080_0000</td><td><code>HA</code></td><td class=\"mut sm\">0x80_1000 − 0x80_0000</td></tr><tr><td><code>die1_aicore</code></td><td class=\"mono\">0x4080_0000</td><td class=\"mono\">0x4080_0000</td><td><code>AICORE</code></td><td class=\"mut sm\">✓ 同构</td></tr><tr><td><code>die1_ha</code></td><td class=\"mono\">0x4080_1000</td><td class=\"mono\">0x4080_0000</td><td><code>HA</code></td><td class=\"mut sm\">✓ 同构</td></tr></tbody>\n  </table>\n  <details class=\"src\"><summary>打平件原文 stars_top_flat.yaml</summary>\n    <pre># ═══════════════════════════════════════════════════════════════\n# 【同事交付件】二级译码 stars 顶层 — 已打平\n# aicore / ha 是模块叶子, 寄存器细节在 CSV 表(nmanager_*.csv)。\n# ═══════════════════════════════════════════════════════════════\ntable: stars_top_flat\nbus: noc\nlevel: 2\nowner: stars-team\n\nwindows:\n  # ── die0 ──\n  - {name: die0_aicore, offset: 0x0080_0000, size: 0x0000_1000, target: AICORE, inst: aicore_die0}\n  - {name: die0_ha,     offset: 0x0080_1000, size: 0x0000_1000, target: HA,     inst: ha_die0}\n  # ── die1 ──\n  - {name: die1_aicore, offset: 0x4080_0000, size: 0x0000_1000, target: AICORE, inst: aicore_die1}\n  - {name: die1_ha,     offset: 0x4080_1000, size: 0x0000_1000, target: HA,     inst: ha_die1}\n</pre></details>\n  <p class=\"note\">💡 译码表里<b>不写任何寄存器</b>——只写窗口。写 <code>nmanager_ha.csv</code>（20 个寄存器）后，compose 产出 <code>die0_ha.ha_ctrl</code>、<code>die1_ha.ha_count3</code> 这样的逐寄存器路由，地址是三层偏移自动加出来的。</p>\n</section>\n<section id=\"l3cfg\">\n  <h2>三级 / cfgbus 表</h2>\n  <p class=\"meta\"><span class=\"badge\">bus: cfgbus</span>\n     <span class=\"badge\">维护: 顶层集成组</span>\n     <span class=\"badge file\">cfgbus_uart_flat.yaml</span></p>\n  <p>cfgbus（APB）域，独立地址空间。从 noc 侧经 APB bridge 桥接进来——<b>地址继续累加、不重挂零</b>，所以归一化时减的是桥接窗口基址。这就是你说的“cfgbus 表上能看到 ddie0 地址”的那张表。</p>\n  <table class=\"tbl\">\n    <thead><tr><th>窗口名</th><th>打平 offset</th><th>size</th><th>target</th><th>说明</th></tr></thead>\n    <tbody><tr><td><code>die0_uart0</code></td><td class=\"mono\">0x0040_1000</td><td class=\"mono\">0x0040_0000</td><td><code>UART_PL011</code></td><td class=\"mut sm\">父基址 = peri 的 die0_uart_apb 窗口</td></tr><tr><td><code>die0_uart1</code></td><td class=\"mono\">0x0040_2000</td><td class=\"mono\">0x0040_0000</td><td><code>UART_PL011</code></td><td class=\"mut sm\">0x40_2000 − 0x40_0000</td></tr><tr><td><code>die1_uart0</code></td><td class=\"mono\">0x4040_1000</td><td class=\"mono\">0x4040_0000</td><td><code>UART_PL011</code></td><td class=\"mut sm\">✓ 同构</td></tr><tr><td><code>die1_uart1</code></td><td class=\"mono\">0x4040_2000</td><td class=\"mono\">0x4040_0000</td><td><code>UART_PL011</code></td><td class=\"mut sm\">✓ 同构</td></tr></tbody>\n  </table>\n  <details class=\"src\"><summary>打平件原文 cfgbus_uart_flat.yaml</summary>\n    <pre># ═══════════════════════════════════════════════════════════════\n# 【同事交付件】cfgbus 表(三级) — 已打平\n# cfgbus(APB) 域, 从 noc 桥接进来。用户原话:\n#   &quot;cfgbus 表上我也可以看到 ddie0 的地址&quot; — 即本表,\n#   每行已经是最终地址, 不需要再加 die 偏移。\n# ═══════════════════════════════════════════════════════════════\ntable: cfgbus_uart_flat\nbus: cfgbus\nlevel: 3\nowner: top-integration\n\nwindows:\n  # ── die0 ──\n  - {name: die0_uart0, offset: 0x0040_1000, size: 0x0000_1000, target: UART_PL011, inst: uart0_die0}\n  - {name: die0_uart1, offset: 0x0040_2000, size: 0x0000_1000, target: UART_PL011, inst: uart1_die0}\n  # ── die1 ──\n  - {name: die1_uart0, offset: 0x4040_1000, size: 0x0000_1000, target: UART_PL011, inst: uart0_die1}\n  - {name: die1_uart1, offset: 0x4040_2000, size: 0x0000_1000, target: UART_PL011, inst: uart1_die1}\n</pre></details>\n  <p class=\"note\">💡 cfgbus 表<b>不属于 L1 直接引用</b>，所以场景里不例化它——它由 peri_top 的桥接窗口引用，prefix 从父层自动传导（<code>die0_uart0</code> / <code>die1_uart0</code>）。归一时它同样被写成一份 die0 相对布局。</p>\n</section>", "convert": "<h1>减法归一：每行减<b>直接父窗口</b>基址</h1>\n<p class=\"lead\">关键不是减 die 基址，而是减<b>直接父窗口</b>的绝对基址——对 L2 是 L1 的 die 窗口，对 L3 是 L2 的桥接窗口。减完每个 die 的相对布局必须完全一致，否则就是“die1 和 die0 一样”这个假设不成立。</p>\n\n<section id=\"conv-l1\">\n  <h2>一级译码表</h2>\n  <table class=\"tbl\">\n    <thead><tr><th>窗口</th><th>打平地址</th><th>− 父窗口基址</th><th>= 归一化 offset</th><th>target</th><th>算式</th></tr></thead>\n    <tbody><tr><td><code>die0_peri</code></td><td class=\"mono\">0x0040_0000</td><td class=\"mono mut\">0x0010_0000</td><td class=\"mono hi\">0x0040_0000</td><td><code>peri_top</code></td><td class=\"mut sm\">— 无父窗口，原样保留</td></tr><tr><td><code>die0_stars</code></td><td class=\"mono\">0x0080_0000</td><td class=\"mono mut\">0x0010_0000</td><td class=\"mono hi\">0x0080_0000</td><td><code>stars_top</code></td><td class=\"mut sm\">— 无父窗口，原样保留</td></tr><tr><td><code>die1_peri</code></td><td class=\"mono\">0x4040_0000</td><td class=\"mono mut\">0x0010_0000</td><td class=\"mono hi\">0x4040_0000</td><td><code>peri_top</code></td><td class=\"mut sm\">— die1 空间起点 = 0x4000_0000</td></tr><tr><td><code>die1_stars</code></td><td class=\"mono\">0x4080_0000</td><td class=\"mono mut\">0x0010_0000</td><td class=\"mono hi\">0x4080_0000</td><td><code>stars_top</code></td><td class=\"mut sm\">— 与 die0 差 0x4000_0000</td></tr></tbody>\n  </table>\n  <div class=\"two\">\n    <div><div class=\"two-h\">归一化后 l1_sys.yaml</div><pre>table: l1_sys\nbus: noc\nlevel: 1\nowner: system-arch\nwindows:\n    - name: die0_peri\n      offset: &quot;0x0040_0000&quot;\n      size: &quot;0x0010_0000&quot;\n      target: die0_peri\n    - name: die0_stars\n      offset: &quot;0x0080_0000&quot;\n      size: &quot;0x0010_0000&quot;\n      target: die0_stars\n    - name: die1_peri\n      offset: &quot;0x4040_0000&quot;\n      size: &quot;0x0010_0000&quot;\n      target: die1_peri\n    - name: die1_stars\n      offset: &quot;0x4080_0000&quot;\n      size: &quot;0x0010_0000&quot;\n      target: die1_stars\n</pre></div>\n  </div>\n</section>\n<section id=\"conv-l2peri\">\n  <h2>二级译码表 · peri</h2>\n  <table class=\"tbl\">\n    <thead><tr><th>窗口</th><th>打平地址</th><th>− 父窗口基址</th><th>= 归一化 offset</th><th>target</th><th>算式</th></tr></thead>\n    <tbody><tr><td><code>die0_uart_apb</code></td><td class=\"mono\">0x0040_0000</td><td class=\"mono mut\">0x0040_0000</td><td class=\"mono hi\">0x0</td><td><code>cfgbus_uart</code></td><td class=\"mut sm\">父基址 = L1 的 die0_peri 窗口</td></tr><tr><td><code>die0_gpio</code></td><td class=\"mono\">0x0041_0000</td><td class=\"mono mut\">0x0040_0000</td><td class=\"mono hi\">0x1_0000</td><td><code>GPIO</code></td><td class=\"mut sm\">0x41_0000 − 0x40_0000</td></tr><tr><td><code>die1_uart_apb</code></td><td class=\"mono\">0x4040_0000</td><td class=\"mono mut\">0x4040_0000</td><td class=\"mono hi\">0x0</td><td><code>cfgbus_uart</code></td><td class=\"mut sm\">0x4040_0000 − 0x4040_0000 ✓ 同构</td></tr><tr><td><code>die1_gpio</code></td><td class=\"mono\">0x4041_0000</td><td class=\"mono mut\">0x4040_0000</td><td class=\"mono hi\">0x1_0000</td><td><code>GPIO</code></td><td class=\"mut sm\">✓ 与 die0 一致</td></tr></tbody>\n  </table>\n  <div class=\"two\">\n    <div><div class=\"two-h\">归一化后 peri_top.yaml</div><pre>table: peri_top\nbus: noc\nlevel: 2\nowner: top-integration\nwindows:\n    - name: uart_apb\n      offset: &quot;0x0&quot;\n      size: &quot;0x0001_0000&quot;\n      target: cfgbus_uart\n      bridge: true\n    - name: gpio\n      offset: &quot;0x1_0000&quot;\n      size: &quot;0x0000_1000&quot;\n      target: GPIO\n      inst: gpio\n</pre></div>\n  </div>\n</section>\n<section id=\"conv-l2stars\">\n  <h2>二级译码表 · stars</h2>\n  <table class=\"tbl\">\n    <thead><tr><th>窗口</th><th>打平地址</th><th>− 父窗口基址</th><th>= 归一化 offset</th><th>target</th><th>算式</th></tr></thead>\n    <tbody><tr><td><code>die0_aicore</code></td><td class=\"mono\">0x0080_0000</td><td class=\"mono mut\">0x0080_0000</td><td class=\"mono hi\">0x0</td><td><code>AICORE</code></td><td class=\"mut sm\">父基址 = L1 的 die0_stars 窗口</td></tr><tr><td><code>die0_ha</code></td><td class=\"mono\">0x0080_1000</td><td class=\"mono mut\">0x0080_0000</td><td class=\"mono hi\">0x1000</td><td><code>HA</code></td><td class=\"mut sm\">0x80_1000 − 0x80_0000</td></tr><tr><td><code>die1_aicore</code></td><td class=\"mono\">0x4080_0000</td><td class=\"mono mut\">0x4080_0000</td><td class=\"mono hi\">0x0</td><td><code>AICORE</code></td><td class=\"mut sm\">✓ 同构</td></tr><tr><td><code>die1_ha</code></td><td class=\"mono\">0x4080_1000</td><td class=\"mono mut\">0x4080_0000</td><td class=\"mono hi\">0x1000</td><td><code>HA</code></td><td class=\"mut sm\">✓ 同构</td></tr></tbody>\n  </table>\n  <div class=\"two\">\n    <div><div class=\"two-h\">归一化后 stars_top.yaml</div><pre>table: stars_top\nbus: noc\nlevel: 2\nowner: stars-team\nwindows:\n    - name: aicore\n      offset: &quot;0x0&quot;\n      size: &quot;0x0000_1000&quot;\n      target: AICORE\n      inst: aicore\n    - name: ha\n      offset: &quot;0x1000&quot;\n      size: &quot;0x0000_1000&quot;\n      target: HA\n      inst: ha\n</pre></div>\n  </div>\n</section>\n<section id=\"conv-l3cfg\">\n  <h2>三级 / cfgbus 表</h2>\n  <table class=\"tbl\">\n    <thead><tr><th>窗口</th><th>打平地址</th><th>− 父窗口基址</th><th>= 归一化 offset</th><th>target</th><th>算式</th></tr></thead>\n    <tbody><tr><td><code>die0_uart0</code></td><td class=\"mono\">0x0040_1000</td><td class=\"mono mut\">0x0040_0000</td><td class=\"mono hi\">0x1000</td><td><code>UART_PL011</code></td><td class=\"mut sm\">父基址 = peri 的 die0_uart_apb 窗口</td></tr><tr><td><code>die0_uart1</code></td><td class=\"mono\">0x0040_2000</td><td class=\"mono mut\">0x0040_0000</td><td class=\"mono hi\">0x2000</td><td><code>UART_PL011</code></td><td class=\"mut sm\">0x40_2000 − 0x40_0000</td></tr><tr><td><code>die1_uart0</code></td><td class=\"mono\">0x4040_1000</td><td class=\"mono mut\">0x4040_0000</td><td class=\"mono hi\">0x1000</td><td><code>UART_PL011</code></td><td class=\"mut sm\">✓ 同构</td></tr><tr><td><code>die1_uart1</code></td><td class=\"mono\">0x4040_2000</td><td class=\"mono mut\">0x4040_0000</td><td class=\"mono hi\">0x2000</td><td><code>UART_PL011</code></td><td class=\"mut sm\">✓ 同构</td></tr></tbody>\n  </table>\n  <div class=\"two\">\n    <div><div class=\"two-h\">归一化后 cfgbus_uart.yaml</div><pre>table: cfgbus_uart\nbus: cfgbus\nlevel: 3\nowner: top-integration\nwindows:\n    - name: uart0\n      offset: &quot;0x1000&quot;\n      size: &quot;0x0000_1000&quot;\n      target: UART_PL011\n      inst: uart0\n    - name: uart1\n      offset: &quot;0x2000&quot;\n      size: &quot;0x0000_1000&quot;\n      target: UART_PL011\n      inst: uart1\n</pre></div>\n  </div>\n</section>\n<h2>为什么不能只减一级</h2>\n<pre class=\"cmd\">打平地址 0x0041_0000 (peri 里的 gpio)\n  ✗ 只减 die 基址 0x4000_0000  → 0x0041_0000  (错, 还是含 peri 窗口偏移)\n  ✓ 减直接父窗口 die0_peri 0x0040_0000 → 0x1_0000   (对)\n\n打平地址 0x0040_1000 (cfgbus 里的 uart0)\n  ✗ 只减 die 基址            → 0x0040_1000  (错)\n  ✗ 减 peri 的 die0_peri 窗口 → 0x1000       (差一步)\n  ✓ 减直接父窗口 die0_uart_apb 0x0040_0000 → 0x1000  (对 — uart_apb 恰与 die0_peri 同址)</pre>", "iso": "<h1>同构检查：两个 die 真的“一样”吗</h1>\n<p class=\"lead\">同事说“die1 和 die0 一样”。这句话必须被<b>验证</b>，不能假设。flatten 的做法是把同一张表按各 die 基址分桶，桶内每条窗口的相对偏移、size、target、inst 做多重集比对——全部一致才通过。</p>\n\n<h2>判定规则</h2>\n<pre class=\"cmd\">桶归属: 窗口归入 \"≤ 其绝对 offset 的最大引用基址\" 那个桶\n  cfgbus_uart_flat 窗口 die0_uart0 @0x0040_1000 → 桶0 (die0 基址 0x0040_0000)\n  cfgbus_uart_flat 窗口 die1_uart0 @0x4040_1000 → 桶1 (die1 基址 0x4040_0000)\n\n同构签名 (每桶): sorted[{相对偏移, size, target, inst}]\n  桶0: 0x1000/0x1000/UART_PL011/uart0 | 0x2000/0x1000/UART_PL011/uart1\n  桶1: 0x1000/0x1000/UART_PL011/uart0 | 0x2000/0x1000/UART_PL011/uart1\n  → 签名相同 ✓ 同构成立, 只输出 die0 一份布局</pre>\n\n<h2>本次实跑结果</h2>\n<pre class=\"cmd\">── 同构检查 ──\n  die1(经die1_uart_apb) 与 die0 同构 ✓\n  die1(经die1_peri)     与 die0 同构 ✓\n  die1(经die1_stars)    与 die0 同构 ✓</pre>\n\n<h2>不同构会怎样</h2>\n<p>如果某条窗口在两个 die 的偏移不一致（比如 die1 多挂了个模块、或地址排布不同），flatten 直接报错退出，并打印两边的签名：</p>\n<pre class=\"cmd\">error: table \"xxx\": die1(经die1_yyy) 相对布局 ≠ die0\n    die0: 0x0/0x1000/GPIO/gpio|0x1000/0x1000/TIMER/timer|\n    die1: 0x0/0x1000/GPIO/gpio|0x2000/0x1000/TIMER/timer|\n  — 该子树\"各 die 一样\"不成立, 需拆表</pre>\n<p class=\"note\">💡 这是<b>最有价值的输出</b>：它把“两个 die 长得一样”这个口头假设变成了可执行断言。<b>不同构的地方就是你必须知道的真相</b>——那块子树得单独建表、单独例化。</p>", "assemble": "<h1>组装：产出整系统地址 map</h1>\n<p class=\"lead\">归一化表 + 场景交给 compose，地址逐级累加，产出最终的 <code>composed_asbuilt.yaml</code>。<b>这就是全系统可用的地址 map</b>——下游 gen-c / gen-sv / gen-yaml / merge 都吃这一个文件。</p>\n\n<h2>场景文件（方案 A：一份表 + N 个带 prefix 的例化）</h2>\n<pre>scenario: asbuilt_flat_normalized\ncomment: 由 chipcfg flatten 自动生成 — 打平交付件归一化(减直接父窗口基址) + 方案A例化\nroots:\n    noc: l1_sys\nroot_bases:\n    noc: &quot;0x0&quot;\ntables:\n    - table: peri_top\n      instances:\n        - name: die0_peri\n          prefix: die0_\n        - name: die1_peri\n          prefix: die1_\n    - table: stars_top\n      instances:\n        - name: die0_stars\n          prefix: die0_\n        - name: die1_stars\n          prefix: die1_\n</pre>\n<p class=\"note\">💡 只有 L1 直接引用的表（peri_top / stars_top）在这里例化。cfgbus_uart 由 peri_top 的桥接窗口引用，<b>prefix 从父层自动传导</b>，不需要也不能在场景里再例化一次。</p>\n\n<h2>最终路由 · 模块叶子（10 条）</h2>\n<table class=\"tbl\">\n  <thead><tr><th>实例名</th><th>最终地址</th><th>总线域</th><th>译码路径</th></tr></thead>\n  <tbody><tr><td><code>die0_uart0</code></td><td class=\"mono\">0x40_1000</td><td><span class=\"bus b-cfgbus\">cfgbus</span></td><td class=\"mut sm\">l1_sys → peri_top → cfgbus_uart</td></tr><tr><td><code>die0_uart1</code></td><td class=\"mono\">0x40_2000</td><td><span class=\"bus b-cfgbus\">cfgbus</span></td><td class=\"mut sm\">l1_sys → peri_top → cfgbus_uart</td></tr><tr><td><code>die0_gpio</code></td><td class=\"mono\">0x41_0000</td><td><span class=\"bus b-noc\">noc</span></td><td class=\"mut sm\">l1_sys → peri_top</td></tr><tr><td><code>die0_aicore</code></td><td class=\"mono\">0x80_0000</td><td><span class=\"bus b-noc\">noc</span></td><td class=\"mut sm\">l1_sys → stars_top</td></tr><tr><td><code>die0_ha</code></td><td class=\"mono\">0x80_1000</td><td><span class=\"bus b-noc\">noc</span></td><td class=\"mut sm\">l1_sys → stars_top</td></tr><tr><td><code>die1_uart0</code></td><td class=\"mono\">0x4040_1000</td><td><span class=\"bus b-cfgbus\">cfgbus</span></td><td class=\"mut sm\">l1_sys → peri_top → cfgbus_uart</td></tr><tr><td><code>die1_uart1</code></td><td class=\"mono\">0x4040_2000</td><td><span class=\"bus b-cfgbus\">cfgbus</span></td><td class=\"mut sm\">l1_sys → peri_top → cfgbus_uart</td></tr><tr><td><code>die1_gpio</code></td><td class=\"mono\">0x4041_0000</td><td><span class=\"bus b-noc\">noc</span></td><td class=\"mut sm\">l1_sys → peri_top</td></tr><tr><td><code>die1_aicore</code></td><td class=\"mono\">0x4080_0000</td><td><span class=\"bus b-noc\">noc</span></td><td class=\"mut sm\">l1_sys → stars_top</td></tr><tr><td><code>die1_ha</code></td><td class=\"mono\">0x4080_1000</td><td><span class=\"bus b-noc\">noc</span></td><td class=\"mut sm\">l1_sys → stars_top</td></tr></tbody>\n</table>\n\n<h2>最终路由 · 寄存器级（42 条，来自 -r 注册的 CSV）</h2>\n<p>译码表里只写了窗口（<code>target: HA</code>），寄存器是 compose 时按 <code>nmanager_ha.csv</code> 展开的：地址 = 模块基址 + 寄存器 offset。</p>\n<table class=\"tbl compact\">\n  <thead><tr><th>实例.寄存器</th><th>最终地址</th><th>模块</th></tr></thead>\n  <tbody><tr><td><code>die0_aicore.aic_ctrl</code></td><td class=\"mono\">0x80_0000</td><td><code>AICORE</code></td></tr><tr><td><code>die0_aicore.aic_status</code></td><td class=\"mono\">0x80_0004</td><td><code>AICORE</code></td></tr><tr><td><code>die0_aicore.aic_taskq_base</code></td><td class=\"mono\">0x80_0008</td><td><code>AICORE</code></td></tr><tr><td><code>die0_aicore.aic_taskq_depth</code></td><td class=\"mono\">0x80_000C</td><td><code>AICORE</code></td></tr><tr><td><code>die0_aicore.aic_mte_ctrl</code></td><td class=\"mono\">0x80_0010</td><td><code>AICORE</code></td></tr><tr><td><code>die0_aicore.aic_cube_dim</code></td><td class=\"mono\">0x80_0014</td><td><code>AICORE</code></td></tr><tr><td><code>die0_aicore.aic_err_inj</code></td><td class=\"mono\">0x80_0018</td><td><code>AICORE</code></td></tr><tr><td><code>die0_aicore.aic_version</code></td><td class=\"mono\">0x80_00FC</td><td><code>AICORE</code></td></tr><tr><td><code>die0_ha.ha_ctrl</code></td><td class=\"mono\">0x80_1000</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_status</code></td><td class=\"mono\">0x80_1004</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_snp_ctrl</code></td><td class=\"mono\">0x80_1008</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_addr_lo0</code></td><td class=\"mono\">0x80_1010</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_addr_hi0</code></td><td class=\"mono\">0x80_1014</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_addr_lo1</code></td><td class=\"mono\">0x80_1018</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_addr_hi1</code></td><td class=\"mono\">0x80_101C</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_err_inj</code></td><td class=\"mono\">0x80_1020</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_count0</code></td><td class=\"mono\">0x80_1040</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_count1</code></td><td class=\"mono\">0x80_1044</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_count2</code></td><td class=\"mono\">0x80_1048</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_count3</code></td><td class=\"mono\">0x80_104C</td><td><code>HA</code></td></tr><tr><td><code>die0_ha.ha_version</code></td><td class=\"mono\">0x80_10FC</td><td><code>HA</code></td></tr><tr><td><code>die1_aicore.aic_ctrl</code></td><td class=\"mono\">0x4080_0000</td><td><code>AICORE</code></td></tr><tr><td><code>die1_aicore.aic_status</code></td><td class=\"mono\">0x4080_0004</td><td><code>AICORE</code></td></tr><tr><td><code>die1_aicore.aic_taskq_base</code></td><td class=\"mono\">0x4080_0008</td><td><code>AICORE</code></td></tr><tr><td><code>die1_aicore.aic_taskq_depth</code></td><td class=\"mono\">0x4080_000C</td><td><code>AICORE</code></td></tr><tr><td><code>die1_aicore.aic_mte_ctrl</code></td><td class=\"mono\">0x4080_0010</td><td><code>AICORE</code></td></tr><tr><td><code>die1_aicore.aic_cube_dim</code></td><td class=\"mono\">0x4080_0014</td><td><code>AICORE</code></td></tr><tr><td><code>die1_aicore.aic_err_inj</code></td><td class=\"mono\">0x4080_0018</td><td><code>AICORE</code></td></tr><tr><td><code>die1_aicore.aic_version</code></td><td class=\"mono\">0x4080_00FC</td><td><code>AICORE</code></td></tr><tr><td><code>die1_ha.ha_ctrl</code></td><td class=\"mono\">0x4080_1000</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_status</code></td><td class=\"mono\">0x4080_1004</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_snp_ctrl</code></td><td class=\"mono\">0x4080_1008</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_addr_lo0</code></td><td class=\"mono\">0x4080_1010</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_addr_hi0</code></td><td class=\"mono\">0x4080_1014</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_addr_lo1</code></td><td class=\"mono\">0x4080_1018</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_addr_hi1</code></td><td class=\"mono\">0x4080_101C</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_err_inj</code></td><td class=\"mono\">0x4080_1020</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_count0</code></td><td class=\"mono\">0x4080_1040</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_count1</code></td><td class=\"mono\">0x4080_1044</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_count2</code></td><td class=\"mono\">0x4080_1048</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_count3</code></td><td class=\"mono\">0x4080_104C</td><td><code>HA</code></td></tr><tr><td><code>die1_ha.ha_version</code></td><td class=\"mono\">0x4080_10FC</td><td><code>HA</code></td></tr></tbody>\n</table>\n\n<h2>地址是怎么加出来的</h2>\n<pre class=\"cmd\">die1_ha.ha_count3  = 0x0408_0104C\n  = L1 die1_stars 窗口   0x4080_0000   (打平件里就有)\n  + stars_top.ha  偏移   0x0000_1000   (归一化后只存相对值)\n  + HA_COUNT3  偏移      0x0000_004C   (来自 nmanager_ha.csv)\n  ────────────────────────────────────\n                          0x4080_104C   (== 打平件里的最终地址 ✓)</pre>\n\n<h2>对账输出</h2>\n<pre class=\"cmd\">── 组装 + 对账 ──\n  写出 out/composed_asbuilt.yaml (52 routes)\n对账基准 10 个叶子 vs compose 产物 10 个叶子\nRECONCILIATION: PASS ✓ — compose 地址与打平交付件完全一致</pre>\n<p class=\"note\">💡 对账按<b>总线域</b>分别比对集合：打平件里有、产物里没有 → MISSING（减法算错或丢窗口）；产物里有、打平件里没有 → EXTRA（多算或例化错了）。地址错一位都会被抓出来。</p>", "query": "<h1>拿到 map 之后怎么查</h1>\n<p class=\"lead\">composed.yaml 是纯文本 YAML，可以直接 grep / Python 查询。三种最常用的查法：</p>\n\n<h2>① 查模块基地址</h2>\n<pre class=\"cmd\">$ grep -A3 \"instance: die1_ha$\" out/composed_asbuilt.yaml\ninstance: die1_ha\nmodule: HA\nbus: noc\nbase: 0x40801000</pre>\n\n<h2>② 用 Python 查任意模块的全部寄存器</h2>\n<pre class=\"cmd\">import yaml\nroutes = yaml.safe_load(open('out/composed_asbuilt.yaml'))['routes']\n# 查 die1 的 HA 模块所有寄存器\nfor r in routes:\n    if r['instance'].startswith('die1_ha.'):\n        print(f\"{r['instance']:<22} 0x{r['base']:09X}\")\n# die1_ha.ha_ctrl          0x040801000\n# die1_ha.ha_status        0x040801004\n# die1_ha.ha_count3        0x04080104C</pre>\n\n<h2>③ 按地址反查（给寄存器访问日志定位用）</h2>\n<pre class=\"cmd\">def lookup(addr, routes):\n    hit = [r for r in routes\n           if r['base'] &lt;= addr &lt; r['base'] + r['size']]\n    return max(hit, key=lambda r: r['base'])   # 最精确的匹配\n\nlookup(0x04080104C, routes)\n# {'instance': 'die1_ha.ha_count3', 'module': 'HA', 'bus': 'noc',\n#  'leaf': 'register', 'base': 0x4080104c, 'size': 4, ...}</pre>\n\n<h2>三条维护规则</h2>\n<div class=\"rules\">\n  <div class=\"rule\"><b>交付件更新了 → 重跑 flatten</b><br>\n  不要手工改归一化表。重跑 flatten 会重新减法、重新同构检查、重新对账，全程一条命令。</div>\n  <div class=\"rule\"><b>对账 FAIL → 先别动下游</b><br>\n  FAIL 意味着“交付件说的”和“你的建模算出的”不一致。这个信号必须查清（通常是减法算错或结构假设错了），不能带着它跑 gen-c。</div>\n  <div class=\"rule\"><b>只有 composed.yaml 交给下游</b><br>\n  norm/*.yaml 和 scenario 是中间产物；gen-c / gen-sv / gen-yaml / merge 一律喂 composed.yaml。</div>\n</div>"};
function show(id){
  document.querySelectorAll("nav a[data-sec]").forEach(a=>a.classList.toggle("on",a.dataset.sec===id));
  const el = document.getElementById("page");
  el.innerHTML = pages[id] || pages.overview;
  el.querySelectorAll("section[id]").forEach(s=>{
    document.getElementById("sub-"+SECS.find(x=>x)).innerHTML="";
  });
  buildSub(id);
  window.scrollTo(0, 0);
  try{ localStorage.setItem("chipcfg_flat_sec", id); }catch(e){}
}
function buildSub(id){
  const el = document.getElementById("page");
  const secs = el.querySelectorAll("section[id]");
  const box = document.getElementById("sub-"+id);
  if(!box) return;
  box.innerHTML = "";
  secs.forEach(s=>{
    const t = s.querySelector("h2");
    if(!t) return;
    const a = document.createElement("a");
    a.textContent = "· " + t.textContent;
    a.href = "javascript:void(0)";
    a.onclick = ()=> s.scrollIntoView({behavior:"smooth"});
    box.appendChild(a);
  });
}
window.addEventListener("load", ()=>{
  let start = "overview";
  try{ start = localStorage.getItem("chipcfg_flat_sec") || "overview"; }catch(e){}
  if(!pages[start]) start = "overview";
  show(start);
  const tt = document.getElementById("toTop");
  window.addEventListener("scroll", ()=>{ tt.style.display = window.scrollY>500?"flex":"none"; });
  tt.onclick = ()=> window.scrollTo({top:0,behavior:"smooth"});
  // 恢复页内滚动位置
  try{
    const y = parseInt(localStorage.getItem("chipcfg_flat_y_"+start)||"0",10);
    if(y) setTimeout(()=>window.scrollTo(0,y), 60);
  }catch(e){}
  let st;
  window.addEventListener("scroll", ()=>{
    clearTimeout(st);
    st = setTimeout(()=>{
      try{ localStorage.setItem("chipcfg_flat_y_"+current, window.scrollY); }catch(e){}
    }, 200);
  });
});
let current = "overview";
document.addEventListener("click", e=>{
  const a = e.target.closest("nav a[data-sec]");
  if(!a) return;
  e.preventDefault();
  current = a.dataset.sec;
  show(current);
});
window.addEventListener("beforeunload", ()=>{
  try{ localStorage.setItem("chipcfg_flat_y_"+current, window.scrollY); }catch(e){}
});
</script>
