<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>浪的约定 · 我们不必同速</title>
<link rel="icon" href="data:,">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d2137;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0d2137 0%,#173a5c 55%,#3a5f7d 100%);color:#eef6ff;
    text-align:center;padding:26px;z-index:20;transition:opacity .4s;}
  .ov.hidden{opacity:0;pointer-events:none;}
  .pic{max-width:min(78vw,340px);width:100%;border-radius:18px;
    box-shadow:0 14px 44px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);}
  h1{font-size:30px;letter-spacing:6px;margin:20px 0 6px;color:#ffd166;text-shadow:0 2px 12px rgba(0,0,0,.4);}
  .sub{font-size:14px;opacity:.85;line-height:1.9;max-width:420px;}
  .story{font-size:15px;line-height:2.0;max-width:430px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:16px 18px;margin:16px 0;}
  .btn{background:#ffd166;color:#4a2c14;border:none;padding:13px 34px;font-size:17px;font-weight:700;
    border-radius:999px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.35);margin-top:14px;}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:rgba(255,255,255,.14);color:#eef6ff;font-weight:500;font-size:14px;padding:10px 24px;}
  #hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    display:none;justify-content:space-between;align-items:center;z-index:10;pointer-events:none;}
  #hud .tag{font-size:13px;font-weight:700;color:#fff;background:rgba(13,33,55,.55);
    padding:5px 12px;border-radius:999px;backdrop-filter:blur(4px);}
  #hearts{font-size:15px;letter-spacing:2px;}
  #goal{font-size:12px;opacity:.9;background:rgba(13,33,55,.55);padding:5px 12px;border-radius:999px;}
  #dlg{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;padding:10px 14px calc(14px + env(safe-area-inset-bottom));}
  #dlgBox{max-width:520px;margin:0 auto;}
  /* 聊天气泡 */
  #ovChat{padding:14px 12px calc(14px + env(safe-area-inset-bottom));justify-content:flex-start;}
  #chatScroll{width:100%;max-width:480px;flex:1;overflow-y:auto;padding:10px 2px;-webkit-overflow-scrolling:touch;}
  #chatBox{display:flex;flex-direction:column;}
  .bub{display:flex;margin:7px 0;align-items:flex-end;gap:7px;animation:up .3s both;}
  .bub.j{justify-content:flex-start;}
  .bub.b{justify-content:flex-end;}
  .bub .av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);}
  .bub.j .av{background:rgba(255,209,102,.22);}
  .bub.b .av{background:rgba(126,200,230,.22);}
  .msgwrap{max-width:76%;display:flex;flex-direction:column;}
  .bub.j .msgwrap{align-items:flex-start;}
  .bub.b .msgwrap{align-items:flex-end;}
  .who{font-size:10.5px;opacity:.5;margin:0 6px 2px;}
  .msg{padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.75;text-align:left;}
  .bub.j .msg{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-bottom-left-radius:4px;}
  .bub.j .msg.king{background:rgba(90,60,140,.35);border-color:rgba(180,150,255,.4);}
  .bub.j .msg.family{background:rgba(120,180,140,.28);border-color:rgba(170,220,190,.4);}
  .bub.b .msg{background:#3d6e9e;border-bottom-right-radius:4px;}
  .narr{text-align:center;color:rgba(238,246,255,.62);font-size:13px;line-height:1.85;margin:10px 8px;animation:up .3s both;}
  .note{margin:10px auto;max-width:84%;background:#f6efdd;color:#5a4632;border-radius:12px;padding:11px 14px;
    font-size:14px;line-height:1.8;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:up .3s both;}
  .note:before{content:'📎 字条';display:block;font-size:11px;opacity:.6;margin-bottom:4px;}
  .gold{color:#ffd166;}
  #chatNext{text-align:center;font-size:12px;opacity:.6;margin-top:8px;animation:pulse 1.6s infinite;}
  @keyframes pulse{50%{opacity:.2}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <span class="tag" id="dayLabel"></span>
  <span class="tag" id="hearts"></span>
  <span class="tag" id="goal"></span>
</div>

<div id="dlg"><div id="dlgBox"></div></div>

<!-- 聊天框叙事层 -->
<div class="ov hidden" id="ovChat">
  <div id="chatScroll"><div id="chatBox"></div></div>
  <button class="btn" id="btnChatGo" style="display:none">出发 ▸</button>
  <div id="chatNext">▼ 继续</div>
</div>

<!-- 封面 -->
<div class="ov" id="ovCover">
  <img class="pic" id="coverPic" alt="">
  <h1>浪的约定</h1>
  <p class="sub">一个关于海、误会与绕路的狗狗夏日物语<br>桨板 · 钓鱼 · 冲浪 · 漂流</p>
  <button class="btn" id="btnStart">🌊 开始旅程</button>
  <button class="btn ghost" id="btnStory" style="margin-top:10px;">📖 剧情模式 · 只看故事</button>
</div>

<!-- 失败 -->
<div class="ov hidden" id="ovFail">
  <h1 style="font-size:22px;">🌊 一个浪头打过来…</h1>
  <p class="sub" id="failText"></p>
  <div style="display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;">
    <button class="btn" id="btnRetry">再试一次</button>
    <button class="btn ghost" id="btnSkip">故事优先，跳过本关 ▸</button>
  </div>
</div>

<!-- 结局收尾 -->
<div class="ov hidden" id="ovEnd">
  <img class="pic" id="endPic" alt="">
  <p class="story" style="margin-top:18px;">🌊 《浪的约定》· 完<br><span style="opacity:.7;font-size:13px">两条航迹，并成了一条。</span></p>
  <button class="btn" id="btnReplay">🔄 再玩一次</button>
</div>

var cv=document.getElementById('cv'),X=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;X.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize);resize();

var $=function(id){return document.getElementById(id);};
var GAME=[];
var day=0,hearts=3,starCount=0,starGoal=0;
var running=false,paused=false,raf=0,lastT=0;
var memories=[],state={};

function show(id){ ['ovCover','ovChat','ovFail','ovEnd'].forEach(function(o){
  $(o).classList.toggle('hidden',o!==id); }); }
function hideAll(){ show('__none__'); }
function hud(on,label,goalText2){
  $('hud').style.display=on?'flex':'none';
  if(label)$('dayLabel').textContent=label;
  if(goalText2)$('goal').textContent=goalText2;
  $('hearts').textContent='❤️'.repeat(hearts)+'🤍'.repeat(Math.max(0,3-hearts));
}
function goalText(){ return (state.goalLabel||('🐚 '+starCount+' / '+starGoal)); }
function addStar(n){ starCount+=n||1; hud(true,null,goalText()); }

/* ================= 聊天框引擎 ================= */
var chatScreens=[],chatIdx=0,chatOnDone=null,chatGoLabel=null;
function msgEl(m){
  var el;
  if(m.w==='n'){ el=document.createElement('div');el.className='narr';el.textContent=m.t;return el; }
  if(m.w==='note'){ el=document.createElement('div');el.className='note';el.textContent=m.t;return el; }
  el=document.createElement('div');el.className='bub '+(m.w==='b'?'b':'j');
  var av=document.createElement('div');av.className='av';
  av.textContent=m.w==='b'?'🐶':(m.w==='w'?'🌊':(m.w==='m'?'🐚':'🐕'));
  var wrap=document.createElement('div');wrap.className='msgwrap';
  var who=document.createElement('div');who.className='who';
  who.textContent=m.w==='b'?'小白':(m.w==='w'?'浪王传令':(m.w==='m'?'海螺留言':'小金毛'));
  var msg=document.createElement('div');msg.className='msg'+(m.w==='w'?' king':(m.w==='m'?' family':''));msg.innerHTML=m.t;
  wrap.appendChild(who);wrap.appendChild(msg);
  el.appendChild(av);el.appendChild(wrap);
  return el;
}
function showChat(screens,opt){
  opt=opt||{};
  chatScreens=screens;chatIdx=0;chatOnDone=opt.onDone||null;chatGoLabel=opt.goLabel||null;
  $('btnChatGo').style.display='none';
  $('btnChatGo').textContent=chatGoLabel||'继续 ▸';
  $('chatNext').style.display='block';
  show('ovChat');renderChatScreen();
}
function renderChatScreen(){
  var box=$('chatBox');box.innerHTML='';
  chatScreens[chatIdx].forEach(function(m,i){
    var el=msgEl(m);el.style.animationDelay=(i*0.12)+'s';box.appendChild(el);
  });
  $('chatScroll').scrollTop=$('chatScroll').scrollHeight;
  var last=chatIdx>=chatScreens.length-1;
  $('btnChatGo').style.display=(last&&chatGoLabel)?'inline-block':'none';
  $('chatNext').style.display=(last&&chatGoLabel)?'none':'block';
}
function chatAdvance(){
  if($('ovChat').classList.contains('hidden'))return;
  var last=chatIdx>=chatScreens.length-1;
  if(last){
    if(chatGoLabel)return; /* 等按钮 */
    var f=chatOnDone;chatOnDone=null;f&&f();return;
  }
  chatIdx++;renderChatScreen();
}
$('ovChat').addEventListener('click',function(e){
  if(e.target.closest('button'))return;chatAdvance();
});
$('btnChatGo').addEventListener('click',function(){
  var f=chatOnDone;chatOnDone=null;f&&f();
});

/* ================= 输入 ================= */
var touchSide=0,touchX=0.5,touchDown=false,tapPulse=0;
function gameActive(){ return running&&!paused&&$('dlg').style.display!=='block'; }
function sideFrom(x){ return x<W/2?-1:1; }
function onStart(e){
  if(running===false||!cur)return;
  /* 游戏内小对话（dlg）：点按关闭——不依赖 gameActive */
  var d=$('dlg');
  if(d.style.display==='block'){
    d.style.display='none';
    if(state.onAdvance){var f=state.onAdvance;state.onAdvance=null;}
    if(e.cancelable)e.preventDefault(); return;
  }
  if(!running||paused)return;
  var t=e.touches?e.touches[0]:e;
  touchSide=sideFrom(t.clientX);tapPulse=1;
  if(t){ touchX=t.clientX/W;touchDown=true; }
  if(e.cancelable)e.preventDefault();
}
function onMove(e){ if(!gameActive())return;
  var t=e.touches?e.touches[0]:e; if(t){touchSide=sideFrom(t.clientX);touchX=t.clientX/W;}
  if(e.cancelable)e.preventDefault(); }
function onEnd(){ touchSide=0;touchDown=false; }
['touchstart','touchmove'].forEach(function(ev){document.addEventListener(ev,onStart,{passive:false});});
document.addEventListener('touchend',onEnd,{passive:false});
document.addEventListener('mousedown',onStart);
document.addEventListener('mousemove',function(e){ if(touchSide)onMove(e); });
document.addEventListener('mouseup',onEnd);
document.addEventListener('keydown',function(e){ if(!gameActive())return;
  if(e.key==='ArrowLeft'||e.key==='a'){touchSide=-1;touchX=Math.max(0.08,touchX-0.06);}
  if(e.key==='ArrowRight'||e.key==='d'){touchSide=1;touchX=Math.min(0.92,touchX+0.06);}
  if(e.key===' '){tapPulse=1;touchDown=true;} });
document.addEventListener('keyup',function(e){ if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ArrowRight'||e.key==='d')touchSide=0; });

/* ================= 对话气泡（游戏内小对话） ================= */
function dlg(say){
  var d=$('dlg');
  if(!say){d.style.display='none';return;}
  var box=$('dlgBox');box.innerHTML='';
  var m = say.w==='note' ? say : (say.w ? say : {w:'n',t:say.text||say.t||''});
  box.appendChild(msgEl(m));
  d.style.display='block';
}

/* ================= 海面/角色绘制 ================= */
function drawSea(t){
  var g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#7ec8e3');g.addColorStop(.45,'#4a9cc9');g.addColorStop(1,'#1d5f8a');
  X.fillStyle=g;X.fillRect(0,0,W,H);
  X.save();X.globalAlpha=.35;X.fillStyle='#fff3c4';
  X.beginPath();X.arc(W*0.78,H*0.16,Math.min(W,H)*0.09,0,7);X.fill();X.restore();
  X.strokeStyle='rgba(255,255,255,.25)';X.lineWidth=2;
  for(var i=0;i<4;i++){ X.beginPath();
    for(var x=0;x<=W;x+=14){ var y=H*(0.3+i*0.18)+Math.sin(x*0.02+t*0.0012+i*1.7)*7;
      x===0?X.moveTo(x,y):X.lineTo(x,y);} X.stroke(); }
}
function drawBoard(px,py,tilt,kind){
  X.save();X.translate(px,py);X.rotate(tilt*0.5);
  X.fillStyle=kind==='surf'?'#ff8a5c':'#4ecdc4';
  X.strokeStyle='rgba(0,0,0,.25)';X.lineWidth=2;
  X.beginPath();X.ellipse(0,0,64,13,0,0,7);X.fill();X.stroke();
  X.fillStyle='rgba(255,255,255,.5)';
  X.beginPath();X.ellipse(-18,-3,22,4,0,0,7);X.fill();
  X.restore();
  X.save();X.translate(px,py);X.rotate(tilt*0.5);
  X.fillStyle='#f6f6f6';X.fillRect(-7,-46,14,26);
  X.fillStyle='#f2c9a0';X.beginPath();X.arc(0,-56,10,0,7);X.fill();
  X.fillStyle='#e8b64c';X.beginPath();X.arc(0,-60,10,Math.PI,0);X.fill();
  X.restore();
}
function drawStar(sx,sy,t){
  X.save();X.translate(sx,sy+Math.sin(t*0.003+sx)*4);
  X.font='22px serif';X.textAlign='center';X.textBaseline='middle';
  X.fillText('🐚',0,0);X.restore();
}

/* ================= 失败/暂停辅助 ================= */
function failSeq(screens,failOverlayMsg){
  hearts--;hud(true,null,goalText());
  if(hearts<=0){ running=false;$('failText').textContent=failOverlayMsg;show('ovFail');return; }
  paused=true;showChat(screens,{onDone:function(){paused=false;lastT=performance.now();}});
}
function storyBeat(screens){
  paused=true;showChat(screens,{onDone:function(){paused=false;lastT=performance.now();}});
}

/* ================= Day1 桨板 ================= */
GAME[1]=function(){return{
  goalLabel:null,fi:0,
  init:function(s){ s.px=0.5;s.stars=[];s.star=0;s.fi=0;s.done=false;s.dolT=0;s.tilt=0;s.tiltV=0;
    for(var i=0;i<6;i++)s.stars.push({x:0.12+Math.random()*0.76,y:0.34+Math.random()*0.5,got:false});
    starGoal=6;starCount=0;state.goalLabel=null;
    dlg({w:'note',t:'膝盖放松，像踩在果冻上。左右点按保持平衡，顺手捡起漂来的贝壳。别管我，看前面。'});},
  update:function(dt,t,s){
    var wavePush=Math.sin(t*0.0011)*0.5+Math.sin(t*0.0007+2)*0.3;
    s.tiltV+=wavePush*0.055*dt;
    if(touchSide)s.tiltV-=touchSide*0.16*dt;
    s.tiltV*=Math.pow(0.9,dt*60);s.tilt+=s.tiltV*dt;
    if(Math.abs(s.tilt)>0.55){ s.tilt=0;s.tiltV=0;
      failSeq(DAYS[1].fails[s.fi++%2],'桨板太难了…没事，浪会等你的。');return; }
    s.px+=touchSide*0.11*dt; s.px=Math.max(0.08,Math.min(0.92,s.px));
    for(var i=0;i<s.stars.length;i++){var st=s.stars[i];
      if(!st.got&&Math.abs(st.x-s.px)<0.055&&Math.abs(st.y-0.62)<0.35){st.got=true;addStar();s.star++;}}
    if(s.star>=s.starGoal&&!s.done){ s.done=true;s.dolT=t; }
    if(s.done&&t-s.dolT>1.2){ finishWin(); }
    s.wave=t;},
  draw:function(t,s){
    drawSea(t);
    for(var i=0;i<s.stars.length;i++)if(!s.stars[i].got)drawStar(s.stars[i].x*W,s.stars[i].y*H,t);
    var by=H*0.62+Math.sin(t*0.002)*6;
    drawBoard(s.px*W,by,Math.max(-0.5,Math.min(0.5,s.tilt*1.4)),'sup');
    /* 小金毛游在左边 */

GAME[3]=function(){return{
  goalLabel:'🏄 向前 100m',fi:0,
  init:function(s){ s.dist=0;s.speed=4;s.obs=[];s.stars=[];s.done=false;s.px=0.5;s.fi=0;
    for(var i=0;i<7;i++)s.stars.push({d:8+i*12,lane:Math.random()<0.5?-1:1,got:false});
    for(var j=0;j<6;j++)s.obs.push({d:14+j*15,lane:Math.random()<0.5?-1:1,hit:false});
    starGoal=1;starCount=0;state.goalLabel='🏄 向前 100m';
    dlg({w:'note',t:'浪不是墙，是会动的门。左右滑动转向、加速，看清空隙再冲。只走画了鱼的浮标。'});},
  update:function(dt,t,s){
    var steer=touchDown?touchX:null;
    if(steer!==null){ s.px+=(steer-s.px)*Math.min(1,3.2*dt); s.speed+=4.5*dt; }
    else s.speed-=3*dt;
    s.speed=Math.max(3.4,Math.min(9,s.speed));
    s.dist+=s.speed*dt;
    for(var i=0;i<s.obs.length;i++){var o=s.obs[i];
      if(!o.hit&&Math.abs(o.d-s.dist)<3&&Math.abs(0.5+o.lane*0.22-s.px)<0.16){ o.hit=true;
        failSeq(DAYS[3].fails[s.fi++%2],'浪太大了…没事，礁区会一直等你。');return; }}
    for(var j=0;j<s.stars.length;j++){var st=s.stars[j];
      if(!st.got&&Math.abs(st.d-s.dist)<3&&Math.abs(0.5+st.lane*0.22-s.px)<0.16){ st.got=true;addStar(); }}
    if(s.dist>=100&&!s.done){ s.done=true;finishWin(); }
    tapPulse=0;},
  draw:function(t,s){
    drawSea(t);
    X.save();X.fillStyle='rgba(255,255,255,.14)';
    X.beginPath();X.moveTo(W*0.5-26,H*0.3);X.lineTo(W*0.5+26,H*0.3);
    X.lineTo(W*0.94,H);X.lineTo(W*0.06,H);X.fill();
    X.strokeStyle='rgba(255,255,255,.3)';X.lineWidth=2;
    var firstMark=Math.ceil(s.dist/12)*12;
    for(var m=firstMark;m<=s.dist+110;m+=12){ if(m>100)break;
      var dd=m-s.dist;
      var p=1-dd/110,y=H*0.3+(H*0.62)*p*p,half=(W*0.44)*p*p;
      X.beginPath();X.moveTo(W*0.5-half,y);X.lineTo(W*0.5+half,y);X.stroke();
      X.fillStyle='rgba(255,255,255,.6)';X.font='11px sans-serif';X.textAlign='left';
      X.fillText(m+'m',W*0.5+half+6,y+4);}
    X.restore();
    var sx=s.px*W;
    for(var j2=0;j2<s.stars.length;j2++){var st=s.stars[j2];if(st.got)continue;
      var d1=st.d-s.dist;if(d1<-3||d1>110)continue;
      var p1=1-d1/110,y1=H*0.3+(H*0.62)*p1*p1,half1=(W*0.44)*p1*p1;
      drawStar(W*0.5+st.lane*half1*0.5,y1,t);}
    for(var i2=0;i2<s.obs.length;i2++){var o=s.obs[i2];if(o.hit)continue;
      var d2=o.d-s.dist;if(d2<-3||d2>110)continue;
      var p2=1-d2/110,y2=H*0.3+(H*0.62)*p2*p2,half2=(W*0.44)*p2*p2;
      X.font=(14+p2*26)+'px serif';X.textAlign='center';
      X.fillText('🛟',W*0.5+o.lane*half2*0.5,y2);}
    var spd=(s.speed-3.4)/5.6;
    X.fillStyle='rgba(255,255,255,'+(0.3+spd*0.4)+')';
    X.beginPath();X.ellipse(sx,H*0.86+8,30+spd*26,7,0,0,7);X.fill();
    drawBoard(sx,H*0.86,-spd*0.3+Math.sin(t*0.006)*0.04,'surf');
    X.fillStyle='rgba(13,33,55,.6)';X.font='13px sans-serif';X.textAlign='center';
    X.fillText(touchDown?'⬇ 压低加速！左右滑动转向':'按住屏幕＝加速转向',W/2,H-24);}
};};

  [{w:'n',t:'（最小的弟妹把贝壳贴到耳边。里面传来鲸群远去的长鸣。）'},
   {w:'b',t:'大海也会把小东西送回家。'},
   {w:'n',t:'（碎掉的工牌边，一枚没登记的小贝壳轻轻发亮。）'},
   {w:'note',t:'真正的礼物藏在【彩蛋位置】。去那里找漂流瓶，再输入瓶中暗号。'}]
];

/* ================= 流程控制 ================= */
var cur=null,storyMode=false;

function startDay(){
  hearts=3;starCount=0;cur=GAME[day]();state=cur;
  hud(false);
  showChat(DAYS[day].intro,{goLabel:storyMode?'继续 ▸':'出发 ▸',onDone:function(){
    if(storyMode){ finishWin(); return; }
    hideAll();hud(true,DAYS[day].tag,DAYS[day].how);
    cur.init(state);running=true;paused=false;lastT=performance.now();
    cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  }});
}
function finishWin(){
  running=false;dlg(null);hud(false);
  memories.push(DAYS[day].memory);
  var after=day===3?function(){startEnding();}:function(){day++;startDay();};
  showChat(DAYS[day].win,{goLabel:day===3?'尾声 ▸':'继续 ▸',onDone:after});
}
function startEnding(){
  hud(false);
  showChat(ENDINGS,{goLabel:'完成 ✓',onDone:function(){
    $('endPic').src=ASSET.ending.indexOf('__')===0?'':ASSET.ending;
    show('ovEnd');
  }});
}
$('btnRetry').addEventListener('click',function(){
  hearts=3;hideAll();paused=false;
  hud(true,DAYS[day].tag,DAYS[day].how);
  cur.init(state);running=true;lastT=performance.now();
});
$('btnSkip').addEventListener('click',function(){
  hearts=3;hideAll();paused=false;finishWin();
});
$('btnReplay').addEventListener('click',function(){
  day=1;memories=[];storyMode=false;startDay();
});

/* 序章入口 */
function beginPrologue(){
  $('coverPic').src=ASSET.cover.indexOf('__')===0?'':ASSET.cover;
  showChat(PRO,{onDone:function(){day=1;startDay();}});
}
$('btnStart').addEventListener('click',function(){ storyMode=false;beginPrologue(); });
$('btnStory').addEventListener('click',function(){ storyMode=true;beginPrologue(); });

/* ================= 主循环 ================= */
function loop(now){
  if(!running)return;
  var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  var t=now;
  if(cur){
    var frozen=paused||$('dlg').style.display==='block';
    if(frozen){ cur.draw(t,state); }
    else { cur.update(dt,t,state); if(running&&!paused)cur.draw(t,state); }
  }
  if(running)raf=requestAnimationFrame(loop);
}

/* 调试钩子 */
window._dbg={ get:function(){return {day:day,hearts:hearts,starCount:starCount,starGoal:starGoal,running:running,paused:paused};},
  state:function(){ return {phase:state.phase,px:state.px,tilt:state.tilt,tiltV:state.tiltV,
    dist:state.dist,stars:state.stars,obs:state.obs,star:starCount}; },
  win:function(){ if(running)finishWin(); },
  next:function(step){ day=step||day+1;startDay(); } };
</script>
</body>
