<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>浪的约定 · 夏日物语</title>
<link rel="icon" href="data:,">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d2137;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0d2137 0%,#173a5c 55%,#3a5f7d 100%);color:#eef6ff;
    text-align:center;padding:26px;z-index:20;transition:opacity .4s;}
  .ov.hidden{opacity:0;pointer-events:none;}
  .pic{max-width:min(78vw,340px);width:100%;border-radius:18px;
    box-shadow:0 14px 44px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);}
  h1{font-size:30px;letter-spacing:6px;margin:20px 0 6px;color:#ffd166;text-shadow:0 2px 12px rgba(0,0,0,.4);}
  .sub{font-size:14px;opacity:.85;line-height:1.9;max-width:420px;}
  .story{font-size:15px;line-height:2.0;max-width:430px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:16px 18px;margin:16px 0;}
  .btn{background:#ffd166;color:#4a2c14;border:none;padding:13px 34px;font-size:17px;font-weight:700;
    border-radius:999px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.35);margin-top:14px;}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:rgba(255,255,255,.14);color:#eef6ff;font-weight:500;font-size:14px;padding:10px 24px;}
  .day-tag{font-size:12px;letter-spacing:3px;color:#8fd3ff;margin-bottom:8px;}
  #hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    display:none;justify-content:space-between;align-items:center;z-index:10;pointer-events:none;}
  #hud .tag{font-size:13px;font-weight:700;color:#fff;background:rgba(13,33,55,.55);
    padding:5px 12px;border-radius:999px;backdrop-filter:blur(4px);}
  #hearts{font-size:15px;letter-spacing:2px;}
  #goal{font-size:12px;opacity:.9;background:rgba(13,33,55,.55);padding:5px 12px;border-radius:999px;}
  #dlg{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;padding:10px 14px calc(14px + env(safe-area-inset-bottom));}
  #dlg .box{max-width:520px;margin:0 auto;background:rgba(10,24,40,.88);border:1px solid rgba(255,255,255,.18);
    border-radius:16px;padding:13px 16px;font-size:14.5px;line-height:1.85;color:#eef6ff;backdrop-filter:blur(6px);}
  #dlg .who{color:#ffd166;font-weight:700;margin-right:8px;}
  #dlg .next{float:right;font-size:12px;opacity:.65;}
  .row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <span class="tag" id="dayLabel"></span>
  <span class="tag" id="hearts"></span>
  <span class="tag" id="goal"></span>
</div>

<div id="dlg"><div class="box" id="dlgBox"></div></div>

<!-- 封面 -->
<div class="ov" id="ovCover">
  <img class="pic" id="coverPic" alt="">
  <h1>浪的约定</h1>
  <p class="sub">一个关于海、爷爷与三个心愿的夏日小故事<br>桨板 · 钓鱼 · 冲浪 · 漂流</p>
  <button class="btn" id="btnStart">🌊 开始旅程</button>
</div>

<!-- 序章故事 -->
<div class="ov hidden" id="ovPrologue">
  <img class="pic" id="bottlePic" alt="">
  <p class="story" id="proText"></p>
  <button class="btn" id="btnProNext">继续 ▸</button>
</div>

<!-- 关卡说明 -->
<div class="ov hidden" id="ovBrief">
  <p class="day-tag" id="briefDay"></p>
  <h1 id="briefTitle" style="font-size:24px;letter-spacing:3px;"></h1>
  <p class="story" id="briefStory"></p>
  <p class="sub" id="briefHow"></p>
  <button class="btn" id="btnBriefGo">出发 ▸</button>
</div>

<!-- 过关 -->
<div class="ov hidden" id="ovWin">
  <img class="pic" id="winPic" alt="" style="display:none;">
  <p class="story" id="winText"></p>
  <button class="btn" id="btnWinNext">继续 ▸</button>
</div>

<!-- 失败 -->
<div class="ov hidden" id="ovFail">
  <h1 style="font-size:22px;">🌊 一个浪头打过来…</h1>
  <p class="sub" id="failText"></p>
  <div class="row">
    <button class="btn" id="btnRetry">再试一次</button>
    <button class="btn ghost" id="btnSkip">故事优先，跳过本关 ▸</button>
  </div>
</div>

<!-- 结局 -->
<div class="ov hidden" id="ovEnd">
  <img class="pic" id="endPic" alt="">
  <p class="story" id="endText"></p>
  <button class="btn" id="btnReplay">🔄 再玩一次</button>
</div>

var cv=document.getElementById('cv'),X=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;X.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize);resize();

var $=function(id){return document.getElementById(id);};
var GAME=[];         // 每关一个工厂
var day=0;           // 当前章节 1..3, 4=尾声
var hearts=3;
var starCount=0;     // 本关海星/鱼计数
var starGoal=0;
var running=false;
var raf=0,lastT=0;
var memories=[];     // 收集的记忆短语
var state={};        // 关卡内部状态

function show(id){ ['ovCover','ovPrologue','ovBrief','ovWin','ovFail','ovEnd'].forEach(function(o){
  $(o).classList.toggle('hidden',o!==id); }); }
function hideAll(){ show('__none__'); }
function hud(on,label,goalText){
  $('hud').style.display=on?'flex':'none';
  if(label)$('dayLabel').textContent=label;
  if(goalText)$('goal').textContent=goalText;
  $('hearts').textContent='❤️'.repeat(hearts)+'🤍'.repeat(Math.max(0,3-hearts));
}
function dlg(say){ var d=$('dlg'); if(!say){d.style.display='none';return;}
  d.style.display='block';
  $('dlgBox').innerHTML='<span class="who">'+(say.who||'小澈')+'：</span>'+say.text+
    '<span class="next"> 点击继续 ▸</span>'; }

/* 海面背景（所有玩法共用） */
function drawSea(t){
  var g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#7ec8e3');g.addColorStop(.45,'#4a9cc9');g.addColorStop(1,'#1d5f8a');
  X.fillStyle=g;X.fillRect(0,0,W,H);
  // 太阳/光斑
  X.save();X.globalAlpha=.35;X.fillStyle='#fff3c4';
  X.beginPath();X.arc(W*0.78,H*0.16,Math.min(W,H)*0.09,0,7);X.fill();X.restore();
  // 波浪线
  X.strokeStyle='rgba(255,255,255,.25)';X.lineWidth=2;
  for(var i=0;i<4;i++){ X.beginPath();
    for(var x=0;x<=W;x+=14){ var y=H*(0.3+i*0.18)+Math.sin(x*0.02+t*0.0012+i*1.7)*7;
      x===0?X.moveTo(x,y):X.lineTo(x,y);} X.stroke(); }
}
function drawBoard(px,py,tilt,kind){
  X.save();X.translate(px,py);X.rotate(tilt*0.5);
  X.fillStyle=kind==='surf'?'#ff8a5c':'#4ecdc4';
  X.strokeStyle='rgba(0,0,0,.25)';X.lineWidth=2;
  X.beginPath();X.ellipse(0,0,64,13,0,0,7);X.fill();X.stroke();
  X.fillStyle='rgba(255,255,255,.5)';
  X.beginPath();X.ellipse(-18,-3,22,4,0,0,7);X.fill();
  X.restore();
  // 少年
  X.save();X.translate(px,py);X.rotate(tilt*0.5);
  X.fillStyle='#2c3e50';X.fillRect(-7,-46,14,26);          // 身体
  X.fillStyle='#f2c9a0';X.beginPath();X.arc(0,-56,10,0,7);X.fill(); // 头
  X.fillStyle='#3a2e2a';X.beginPath();X.arc(0,-60,10,Math.PI,0);X.fill(); // 头发
  X.restore();
}
function drawStar(sx,sy,t){
  X.save();X.translate(sx,sy+Math.sin(t*0.003+sx)*4);
  X.font='22px serif';X.textAlign='center';X.textBaseline='middle';
  X.fillText('⭐',0,0);X.restore();
}
function addStar(n){ starCount+=n||1; hud(true,null,goalText()); }
function goalText(){ return (state.goalLabel||('⭐ '+starCount+' / '+starGoal)); }
function loseHeart(msg){
  hearts--; hud(true);
  if(hearts<=0){ running=false; $('failText').textContent=msg||'别灰心，海浪每天都有脾气。';
    show('ovFail'); return true; }
  return false;
}

/* ================= 输入（点击/触摸 = 屏幕 左半/右半） ================= */
var touchSide=0;   // -1 左, 1 右, 0 无
var touchX=0.5;    // 触点归一化 x（Day3 转向）
var touchDown=false;
var tapPulse=0;    // 点按脉冲（钓鱼等）
function gameActive(){ return running; }
function sideFrom(x){ return x < W/2 ? -1 : 1; }
function onStart(e){
  if(!gameActive())return;
  var t=e.touches?e.touches[0]:e;
  /* 对话显示时，点屏幕=推进对话（移动端 click 被 preventDefault 吞掉） */
  var d=$('dlg');
  if(d.style.display==='block'){
    d.style.display='none';
    if(state.onAdvance){ var f=state.onAdvance; state.onAdvance=null; }
    if(e.cancelable)e.preventDefault();
    return;
  }
  touchSide=sideFrom(t.clientX); tapPulse=1;
  if(t){ touchX=t.clientX/W; touchDown=true; }
  if(e.cancelable)e.preventDefault();
}
function onMove(e){ if(!gameActive())return;
  var t=e.touches?e.touches[0]:e; if(t){ touchSide=sideFrom(t.clientX); touchX=t.clientX/W; }
  if(e.cancelable)e.preventDefault(); }
function onEnd(e){ touchSide=0; touchDown=false; }
['touchstart','touchmove'].forEach(function(ev){ document.addEventListener(ev,onStart,{passive:false}); });
document.addEventListener('touchend',onEnd,{passive:false});
document.addEventListener('mousedown',onStart);document.addEventListener('mousemove',function(e){ if(touchSide)onMove(e); });
document.addEventListener('mouseup',onEnd);
document.addEventListener('keydown',function(e){ if(!running)return;
  if(e.key==='ArrowLeft'||e.key==='a'){touchSide=-1;touchX=Math.max(0.08,touchX-0.06);}
  if(e.key==='ArrowRight'||e.key==='d'){touchSide=1;touchX=Math.min(0.92,touchX+0.06);}
  if(e.key===' '){tapPulse=1;touchDown=true;} });
document.addEventListener('keyup',function(e){ if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ArrowRight'||e.key==='d')touchSide=0; });

/* 点击继续对话（dlg 显示时点屏幕推进） */
document.addEventListener('click',function(e){
  var d=$('dlg');
  if(d.style.display==='block' && running && !e.target.closest('button')){
    d.style.display='none';
    if(state.onAdvance){ var f=state.onAdvance; state.onAdvance=null; f(); }
  }
});

/* ================= Day1 桨板平衡 ================= */
GAME[1]=function(){ return {
  goalLabel:null,starGoal:6,star:0,
  tilt:0,tiltV:0,px:0.5,stars:[],wave:0,dolphins:0,dolT:6,done:false,
  init:function(s){ s.px=0.5;s.stars=[];s.star=0;s.dolphins=0;s.dolT=6;s.done=false;s.tilt=0;s.tiltV=0;
    for(var i=0;i<6;i++)s.stars.push({x:0.12+Math.random()*0.76,y:0.34+Math.random()*0.5,got:false});
    starGoal=s.starGoal;starCount=0;state.goalLabel=null;
    dlg({text:'爷爷的字条：“膝盖放松，别硬得像晒鱼架。左右点按保持平衡，顺手捡海星 ⭐。站稳了，替我吹声口哨。”'});},
  update:function(dt,t,s){
    var wavePush=Math.sin(t*0.0011)*0.5+Math.sin(t*0.0007+2)*0.3;
    s.tiltV+=wavePush*0.055*dt;
    if(touchSide)s.tiltV-=touchSide*0.16*dt;
    s.tiltV*=Math.pow(0.9,dt*60);s.tilt+=s.tiltV*dt;
    if(Math.abs(s.tilt)>0.55){ s.tilt=0;s.tiltV=0;
      dlg({text:'哗啦——小澈栽进海里，抹了把脸：“这板肯定记仇！”先稳住重心，再慢慢追上海星。'});
      if(loseHeart('平衡太难了…没事，再来。'))return;
    }
    s.px+=touchSide*0.11*dt; s.px=Math.max(0.08,Math.min(0.92,s.px));
    for(var i=0;i<s.stars.length;i++){var st=s.stars[i];
      if(!st.got&&Math.abs(st.x-s.px)<0.055&&Math.abs(st.y-(0.62))<0.35){st.got=true;addStar();s.star++;}}
    if(s.star>=s.starGoal&&!s.done){ s.done=true;s.dolT=t; }
    if(s.done&&t-s.dolT>1.2){ finishWin(); }
    s.wave=t;},
  draw:function(t,s){
    drawSea(t);
    if(s.done){ // 白海豚
      X.font='40px serif';X.textAlign='center';
      for(var i=0;i<3;i++){ var dx=W*(0.25+i*0.25)+Math.sin(t*0.002+i)*30;
        var dy=H*0.32-Math.abs(Math.sin(t*0.003+i*2))*46;
        X.fillText('🐬',dx,dy);} 
      X.fillStyle='rgba(13,33,55,.6)';var bw=Math.min(W*0.8,340);
      X.fillRect(W/2-bw/2,H*0.5-26,bw,52);
      X.fillStyle='#fff';X.font='16px sans-serif';
      X.fillText('成群的白海豚跃出水面 ✨',W/2,H*0.5+6);
    }
    for(var i=0;i<s.stars.length;i++)if(!s.stars[i].got)drawStar(s.stars[i].x*W,s.stars[i].y*H,t);
    var by=H*0.62+Math.sin(t*0.002)*6;
    drawBoard(s.px*W,by,Math.max(-0.5,Math.min(0.5,s.tilt*1.4)),'sup');
    // 倾斜指示
    X.save();X.globalAlpha=.6;X.fillStyle='#fff';X.font='13px sans-serif';X.textAlign='center';
    X.fillText('◀ 左点按'+(touchSide<0?' ●':'')+'   保持平衡   右点按 ●'+(touchSide>0?'':''),W/2,H-24);
    X.restore();},
  onAdvance:function(){ dlg(null); }
};};

/* ================= Day2 钓鱼 ================= */
GAME[2]=function(){ return {
  goalLabel:null,starGoal:3,phase:'idle',fishX:0.5,fishT:0,biteT:0,biteWin:0,fishY:0,
  init:function(s){ s.phase='idle';s.star=0;starGoal=3;starCount=0;state.goalLabel=null;
    dlg({text:'爷爷的字条：“别跟鱼较劲，它比你有空。浮标亮出‘！’时，立刻点屏幕收线。早了吓跑它，晚了它就笑你。”'});},
  update:function(dt,t,s){
    if(s.phase==='idle'){
      s.fishT-=dt;
      if(s.fishT<=0){ s.phase='waiting';s.fishT=1.2+Math.random()*2.2;
        s.biteT=0.8+Math.random()*0.9;s.fishX=0.2+Math.random()*0.6; }
    } else if(s.phase==='waiting'){
      s.fishT-=dt;
      if(s.fishT<=0){ s.phase='bite';s.biteWin=s.biteT; }
    } else if(s.phase==='bite'){
      s.biteWin-=dt;
      if(s.biteWin<=0){ s.phase='idle';s.fishT=1+Math.random()*1.5;
        dlg({text:'鱼吐个泡泡溜走了。小澈咬牙：“笑吧，下一尾我让你笑不出来。”等“！”亮起，再利落收线 🫧'}); }
    } else if(s.phase==='reel'){
      s.fishY+=0.5*dt;
      if(s.fishY>=1){ s.phase='idle';s.fishT=1.4+Math.random();addStar();s.star++;
        dlg({text:'拉上来了！一尾金鱼披着晚霞，在船边甩出一串碎金。小澈得意地扬眉：“谁笑谁还不一定呢。”🐟✨ ('+s.star+'/3)'}); 
        if(s.star>=3)finishWin(); }
    }
    if(tapPulse&&s.phase==='bite'){ s.phase='reel';s.fishY=0;dlg(null); }
    else if(tapPulse&&s.phase==='waiting'){ dlg({text:'还早点，稳住～ 等「！」亮起再拉 🎣'}); }
    tapPulse=0;},
  draw:function(t,s){
    drawSea(t);
    X.fillStyle='#ffd166';X.beginPath();X.arc(W*0.72,H*0.3,34,0,7);X.fill(); // 落日
    X.fillStyle='rgba(255,209,102,.25)';X.fillRect(0,H*0.34,W,H*0.66);
    var bx=W*0.3,by=H*0.66;
    drawBoard(bx,by,0,'boat');
    // 鱼线
    X.strokeStyle='rgba(255,255,255,.7)';X.lineWidth=1.5;
    var fx=s.phase==='idle'?W*0.3:s.fishX*W;
    var fy=(s.phase==='reel'?H*(0.86-0.5*Math.min(1,s.fishY)):H*0.86);
    X.beginPath();X.moveTo(bx+40,by-8);X.quadraticCurveTo(bx+90,H*0.8,fx,fy);X.stroke();
    // 浮漂
    X.fillStyle='#ff5c5c';X.beginPath();X.arc(fx,fy,6,0,7);X.fill();
    if(s.phase==='bite'){ X.font='34px sans-serif';X.textAlign='center';
      X.fillStyle='#ffeb3b';X.strokeStyle='#c62828';X.lineWidth=3;
      X.strokeText('！',fx,fy-30);X.fillText('！',fx,fy-30); }
    if(s.phase==='reel'){ X.font='26px serif';X.fillText('🐟',fx,fy);
      X.fillStyle='#fff';X.font='13px sans-serif';X.fillText('收线中…',fx,fy+22);}
    X.fillStyle='rgba(13,33,55,.6)';X.font='13px sans-serif';X.textAlign='center';
    X.fillText(s.phase==='bite'?'点击屏幕！':'等待鱼咬钩…',W/2,H-24);},
  onAdvance:function(){}
};};

/* ================= Day3 冲浪 ================= */
GAME[3]=function(){ return {
  goalLabel:'🏄 向前 100m',starGoal:1,dist:0,speed:4,obs:[],stars:[],done:false,px:0.5,
  init:function(s){ s.dist=0;s.speed=4;s.obs=[];s.stars=[];s.done=false;s.px=0.5;
    for(var i=0;i<7;i++)s.stars.push({d:8+i*12,lane:Math.random()<0.5?-1:1,got:false});   // 8..80m
    for(var j=0;j<6;j++)s.obs.push({d:14+j*15,lane:Math.random()<0.5?-1:1,hit:false});     // 14..89m
    starGoal=1;starCount=0;state.goalLabel='🏄 向前 100m';
    dlg({text:'爷爷的字条：“浪不是墙，是会动的门。按住屏幕左右滑动来转向、加速；看清空隙再过。勇敢不是硬撞，逞强才会撞浮标。”'});},
  update:function(dt,t,s){
    var steer=touchDown?touchX:null;
    if(steer!==null){ s.px+=(steer-s.px)*Math.min(1,3.2*dt); s.speed+=4.5*dt; }
    else s.speed-=3*dt;
    s.speed=Math.max(3.4,Math.min(9,s.speed));
    s.dist+=s.speed*dt;
    for(var i=0;i<s.obs.length;i++){var o=s.obs[i];
      if(!o.hit&&Math.abs(o.d-s.dist)<3&&Math.abs(0.5+o.lane*0.22-s.px)<0.16){ o.hit=true;
        dlg({text:'砰——浪板擦上浮标。小澈趴回板面喘气：“知道了，老船长，勇敢也得会拐弯。”放慢一点，从空隙穿过去 🛟'});
        if(loseHeart('浪太大，被卷回岸边了…再冲一次！'))return; }}
    for(var j=0;j<s.stars.length;j++){var st=s.stars[j];
      if(!st.got&&Math.abs(st.d-s.dist)<3&&Math.abs(0.5+st.lane*0.22-s.px)<0.16){ st.got=true;addStar(); }}
    if(s.dist>=100&&!s.done){ s.done=true;finishWin(); }
    tapPulse=0;},
  draw:function(t,s){
    drawSea(t);
    X.save();X.fillStyle='rgba(255,255,255,.14)';
    X.beginPath();X.moveTo(W*0.5-26,H*0.3);X.lineTo(W*0.5+26,H*0.3);
    X.lineTo(W*0.94,H);X.lineTo(W*0.06,H);X.fill();
    X.strokeStyle='rgba(255,255,255,.3)';X.lineWidth=2;
    var firstMark=Math.ceil(s.dist/12)*12;
    for(var m=firstMark;m<=s.dist+110;m+=12){ if(m>100)break;
      var dd=m-s.dist;
      var p=1-dd/110, y=H*0.3+(H*0.62)*p*p, half=(W*0.44)*p*p;
      X.beginPath();X.moveTo(W*0.5-half,y);X.lineTo(W*0.5+half,y);X.stroke();
      X.fillStyle='rgba(255,255,255,.6)';X.font='11px sans-serif';X.textAlign='left';
      X.fillText(m+'m',W*0.5+half+6,y+4);}
    X.restore();
    var sx=s.px*W;
    for(var j=0;j<s.stars.length;j++){var st=s.stars[j];if(st.got)continue;
      var d1=st.d-s.dist;if(d1<-3||d1>110)continue;
      var p1=1-d1/110,y1=H*0.3+(H*0.62)*p1*p1,half1=(W*0.44)*p1*p1;
      drawStar(W*0.5+st.lane*half1*0.5,y1,t);}
    for(var i=0;i<s.obs.length;i++){var o=s.obs[i];if(o.hit)continue;
      var d2=o.d-s.dist;if(d2<-3||d2>110)continue;
      var p2=1-d2/110,y2=H*0.3+(H*0.62)*p2*p2,half2=(W*0.44)*p2*p2;
      X.font=(14+p2*26)+'px serif';X.textAlign='center';
      X.fillText('🛟',W*0.5+o.lane*half2*0.5,y2);}
    var spd=(s.speed-3.4)/5.6;
    X.fillStyle='rgba(255,255,255,'+(0.3+spd*0.4)+')';
    X.beginPath();X.ellipse(sx,H*0.86+8,30+spd*26,7,0,0,7);X.fill();
    drawBoard(sx,H*0.86,-spd*0.3+Math.sin(t*0.006)*0.04,'surf');
    X.fillStyle='rgba(13,33,55,.6)';X.font='13px sans-serif';X.textAlign='center';
    X.fillText(touchDown?'⬇ 压低加速！左右滑动转向':'按住屏幕＝加速转向',W/2,H-24);},
  onAdvance:function(){}
};};

/* ================= 流程控制 ================= */

var tapUsed=false;

var DAYS={

     story:'清晨，小澈划着爷爷的旧桨板去静水湾。爷爷说白海豚爱听口哨，却总吹跑调；每次被笑，他就把草帽扣到小澈脸上。',
     how:'🖐 点按屏幕左/右两侧保持平衡 · 捡满 6 颗海星唤来海豚 🐬'},
  2:{tag:'DAY 2 · 钓鱼',title:'黄昏的金鱼',pic:null,
     story:'黄昏，小澈坐上旧木船，越看清单越别扭：“这破字……不会真是我写的吧？”可他不服输，还是学爷爷把线甩进晚霞。',
     how:'🎣 等「！」亮起时点击屏幕刺鱼 · 钓上 3 尾金鱼'},
  3:{tag:'DAY 3 · 冲浪',title:'穿越大浪',pic:'fish',
     story:'台风外沿将海推成一道高墙。清单翘起的一角，露出蜡笔画：一高一矮两个人，共踩一块浪板。小澈握紧信：“原来你瞒了我这么久。”',
     how:'🏄 按住屏幕＝压低加速 · 松开＝减速 · 冲过 100 米 · 小心浮标 🛟'}
};

function startDay(){
  hearts=3;starCount=0;cur=GAME[day]();state=cur;
  var d=DAYS[day];
  $('briefDay').textContent=d.tag;$('briefTitle').textContent=d.title;
  $('briefStory').textContent=d.story;$('briefHow').textContent=d.how;
  show('ovBrief');
  $('winPic').style.display='none';
}
$('btnBriefGo').addEventListener('click',function(){
  hideAll();hud(true,DAYS[day].tag);
  cur.init(state);running=true;lastT=performance.now();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
});

function finishWin(){
  running=false;dlg(null);hud(false);
  if(day===1)memories.push('白海豚跃出海面的瞬间');
  if(day===2)memories.push('黄昏那尾发光的金鱼');
  if(day===3)memories.push('穿过大浪时的心跳');
  if(day===3){
    $('winText').innerHTML='<b style="color:#ffd166">穿越大浪 ✅</b><br>'+
      '浪从头顶合拢，又在身后轰然碎开。小澈穿过去了。浪板底面浮出一道旧刻痕：<br>“小澈，六岁，刚到爷爷的腰。”<br><br>'+
      '他想起爷爷蹲在院里给板上蜡，满手白霜还嘴硬：“等你敢自己过浪，我才不陪。省得你嫌我管得多。”';
    show('ovWin');return;
  }
  $('winText').innerHTML='<b style="color:#ffd166">'+DAYS[day].title+' ✅</b><br>'+
    (day===1?'跑调的口哨刚响，白海豚便绕桨板三圈。小澈想起六岁那年，爷爷把他扛在肩上：“别怕，海会把走丢的东西送回来。”<br><br>他把一枚海星放进瓶里。盐渍淡了一点，背面露出半个歪歪扭扭的“澈”。':
             '第三尾鱼跃出水面，鳞片盛满夕阳。小澈想起爷爷从不留小鱼：“借来看看就好，海里的好东西不能全搬回家。”<br><br>他把三尾金鱼放回海中。湿润的清单显出一行小字：“等我长到桨那么高……”那分明是他小时候的笔迹。');
  show('ovWin');
}
$('btnWinNext').addEventListener('click',function(){
  if(day===3){ startEnding(); return; }
  day++;startDay();
});

$('btnRetry').addEventListener('click',function(){
  hearts=3;hideAll();hud(true,DAYS[day].tag);cur.init(state);running=true;lastT=performance.now();
});
$('btnSkip').addEventListener('click',function(){
  hearts=3;hideAll();hud(false);finishWin();
});

function startEnding(){
  hud(false);
  $('endPic').src=ASSET.ending.indexOf('__')===0?'':ASSET.ending;
  $('endText').innerHTML='<b style="color:#ffd166">尾声 · 第四个愿望</b><br><br>'+
    '风静下来，小澈躺在桨板上随浪漂流。他拆开那封要“交给海”的信，第一行却写着：<br>“大海先生，麻烦把下面的话念给小澈听。”<br><br>'+
    '“这不是我的心愿清单。是你六岁那年塞进汽水瓶，说长大后要和我一起做的三件事。后来你搬走，也把它忘了。”<br><br>'+
    '“你问海会不会弄丢约定。我说不会，转身却把瓶子捞了回来，晒了三天。谁叫爷爷不太信浪，只信你。”<br><br>'+
    '盐渍彻底化开，第四行是爷爷的字：<span style="color:#ffd166">“等小澈长大，仍愿意回海边，把不开心也讲给爷爷听。”</span><br><br>'+
    '岸上传来跑调的口哨。爷爷戴着歪草帽，举起蓝搪瓷杯：“三天才回来？看来鱼没少笑你。”<br><br>'+
    '小澈鼻尖发酸，偏过脸划向岸边：“少装神秘。第四个愿望，我现在就完成。”海浪追在身后，把祖孙俩的笑声一遍遍送回沙滩。<br><br>'+
    '<span style="opacity:.75;font-size:13px">🌊 收集的记忆：「'+memories.join('」「')+'」</span>';
  show('ovEnd');

$('btnReplay').addEventListener('click',function(){ day=1;memories=[];startDay(); });

/* 序章 */
var proStep=0;
var PRO=[
  '暑假第一天，小澈独自回到海边小屋。爷爷只发来一句：“晚三天到，别把屋顶掀了。”屋里只剩旧桨板晃着影子。',
  '“谁稀罕等他。”小澈踢着沙走到退潮线。一只系着绿色绳结的玻璃瓶滚到脚边——那是爷爷打渔四十年才会系的结。',
  '瓶里有张清单：①看白海豚　②钓起黄昏的金鱼　③穿过大浪，把信交给海。旁边写着：“胆小鬼澈，敢不敢替我跑一趟？”',
  '“激将法对我没用……除非只用三天。”小澈翻过清单，背面还有一行被盐渍盖住。更奇怪的是，前三行的圆字，他越看越眼熟。'
];
$('btnStart').addEventListener('click',function(){
  $('coverPic').src=ASSET.cover.indexOf('__')===0?'':ASSET.cover;
  $('bottlePic').src=ASSET.bottle.indexOf('__')===0?'':ASSET.bottle;
  proStep=0;$('proText').innerHTML=PRO[0];
  show('ovPrologue');
});
$('btnProNext').addEventListener('click',function(){
  proStep++;
  if(proStep<PRO.length){ $('proText').innerHTML=PRO[proStep]; }
  else { day=1;startDay(); }
});

/* ================= 主循环 ================= */
function loop(now){
  if(!running)return;
  var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  var t=now;
  if(cur){
    if($('dlg').style.display==='block'){ cur.draw(t,state); }  // 对话时冻结
    else { cur.update(dt,t,state); if(running)cur.draw(t,state); }
  }
  if(running)raf=requestAnimationFrame(loop);
}

/* 调试钩子 */
window._dbg={ get:function(){return {day:day,hearts:hearts,starCount:starCount,starGoal:starGoal,running:running};},
  state:function(){ return {phase:state.phase,px:state.px,tilt:state.tilt,tiltV:state.tiltV,
    dist:state.dist,stars:state.stars,obs:state.obs,star:starCount}; },
  win:function(){ if(running)finishWin(); },
  next:function(step){ day=step||day+1;startDay(); } };
</script>
